<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetOps AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #111827; color: #e5e7eb; }

    .header { height: 60px; background: #0f172a; border-bottom: 1px solid #1f2937; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
    .title { font-weight: 700; font-size: 20px; }
    .title span { color: #22d3ee; }
    .status { color: #94a3b8; font-size: 13px; }

    .toolbar { height: 48px; background: #111827; border-bottom: 1px solid #1f2937; display: flex; align-items: center; gap: 8px; padding: 0 16px; }
    .btn { padding: 8px 12px; border: 1px solid #334155; background: #1e293b; color: #e5e7eb; border-radius: 6px; cursor: pointer; display: inline-block; text-align: center; min-height: 20px; }
    .btn:hover { border-color: #22d3ee; }

    .layout { height: calc(100vh - 108px); display: grid; grid-template-columns: 200px 1fr; }

    .left { border-right: 1px solid #1f2937; background: #0b1220; padding: 8px; overflow: auto; display: flex; flex-direction: column; }
    .left-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
    .left-tab { flex: 1; padding: 6px 8px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; border-radius: 4px; cursor: pointer; font-size: 11px; }
    .left-tab:hover { border-color: #22d3ee; color: #e5e7eb; }
    .left-tab.active { border-color: #22d3ee; background: #0f172a; color: #22d3ee; }
    .left-content { flex: 1; overflow: auto; }
    .audit-item { padding: 8px; border: 1px solid #1f2937; border-radius: 6px; background: #0f172a; margin-bottom: 4px; font-size: 11px; }
    .audit-time { color: #6b7280; font-size: 10px; }
    .audit-action { color: #22d3ee; font-weight: 600; }
    .audit-target { color: #94a3b8; }
    .audit-success { color: #34d399; }
    .audit-failed { color: #ef4444; }
    .knowledge-item { padding: 8px; border: 1px solid #1f2937; border-radius: 6px; background: #0f172a; margin-bottom: 4px; font-size: 11px; }
    .knowledge-symptom { color: #fb923c; }
    .knowledge-solution { color: #34d399; }
    .left h3 { margin-bottom: 10px; color: #67e8f9; font-size: 14px; }
    .device-item { padding: 8px; border: 1px solid #1f2937; border-radius: 6px; background: #0f172a; margin-bottom: 4px; cursor: pointer; }
    .device-item:hover { border-color: #22d3ee; }
    .device-name { font-weight: 600; font-size: 13px; }
    .device-ip { color: #6b7280; font-size: 11px; margin-top: 2px; }
    .dev-group { margin-bottom: 4px; }
    .dev-group-header { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #0f172a; color: #94a3b8; font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 4px; min-height: 28px; }
    .dev-group-header:hover { background: #1e293b; color: #e5e7eb; }
    .dev-group-arrow { font-size: 9px; transition: transform 0.15s; }
    .dev-group.open .dev-group-arrow { transform: rotate(90deg); }
    .dev-group-body { display: none; }
    .dev-group.open .dev-group-body { display: block; }

    .center { display: flex; flex-direction: column; min-width: 0; overflow-y: auto; }
    .topology-panel { border-bottom: 1px solid #1f2937; padding: 6px; flex-shrink: 0; }
    .topology-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .topology-infinite { position: relative; border: 1px solid #164e63; border-radius: 8px; background: radial-gradient(circle at 20% 20%, #0b1220 0%, #05080f 100%); height: 480px; min-height: 200px; max-height: 80vh; overflow: hidden; resize: vertical; }
    .topology-world { position: absolute; inset: 0; transform-origin: 0 0; }
    #topology-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #topology-node-layer { position: absolute; inset: 0; }
    .topo-node { position: absolute; width: 120px; min-height: 32px; border: 1px solid #22d3ee; border-radius: 8px; background: rgba(6, 15, 27, 0.9); box-shadow: 0 0 10px rgba(34, 211, 238, 0.3); padding: 5px 7px; cursor: pointer; user-select: none; }
    .topo-node:hover { box-shadow: 0 0 16px rgba(56, 189, 248, 0.5); }
    .topo-node.router { border-color: #60a5fa; box-shadow: 0 0 10px rgba(96, 165, 250, 0.35); border-radius: 999px; }
    .topo-node.firewall { border-color: #fb923c; box-shadow: 0 0 10px rgba(251, 146, 60, 0.3); border-radius: 4px; }
    .topo-node.switch { border-color: #34d399; box-shadow: 0 0 10px rgba(52, 211, 153, 0.3); border-radius: 8px; }
    .topo-node.selected { box-shadow: 0 0 24px rgba(245, 158, 11, 0.8), 0 0 48px rgba(245, 158, 11, 0.3) !important; border-color: #f59e0b !important; border-width: 2px; }
    .topo-head { display:flex; align-items:center; gap:4px; }
    .node-dot { width: 8px; height: 8px; border-radius: 50%; background:#22d3ee; box-shadow:0 0 6px #22d3ee; flex: 0 0 8px; }
    .node-icon { width: 14px; height: 14px; flex: 0 0 14px; }
    .node-remark { font-size: 11px; font-weight: 700; color: #d1fafb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 16px; flex: 1; }
    .node-status { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 6px; margin-left: auto; }
    .node-status.online { background: #34d399; box-shadow: 0 0 4px #34d399; }
    .node-status.offline { background: #6b7280; }
    .node-chips { display: flex; gap: 2px; flex-wrap: nowrap; overflow: hidden; margin-top: 2px; }
    .chip { font-size: 9px; padding: 0 3px; border-radius: 2px; background: rgba(34,211,238,0.15); color: #67e8f9; white-space: nowrap; line-height: 12px; }
    .chip.warn { background: rgba(251,146,60,0.2); color: #fb923c; }
    .chip.ok { background: rgba(52,211,153,0.2); color: #34d399; }
    .cmd-output { margin:4px 0; border:1px solid #1e293b; border-radius:4px; overflow:hidden; }
    .cmd-header { display:flex; justify-content:space-between; padding:4px 8px; background:rgba(30,41,59,0.8); cursor:pointer; font-size:11px; color:#94a3b8; }
    .cmd-header:hover { background:rgba(51,65,85,0.8); }
    .cmd-name { color:#e2e8f0; font-weight:600; }
    .cmd-toggle { color:#64748b; font-size:10px; }
    .cmd-body { padding:6px 8px; background:rgba(6,15,27,0.6); font-size:10px; color:#94a3b8; max-height:300px; overflow-y:auto; }
    .cmd-body.collapsed { max-height:60px; overflow:hidden; position:relative; }
    .cmd-body.collapsed::after { content:''; position:absolute; bottom:0; left:0; right:0; height:20px; background:linear-gradient(transparent,rgba(6,15,27,0.9)); }
    .chip.ok { background: rgba(52,211,153,0.2); color: #34d399; }
    .topo-edge { stroke: #22d3ee; stroke-width: 1.8; opacity: 0.9; fill: none; }
    .topo-edge.trunk { stroke: #f59e0b; }
    .topo-edge.access { stroke: #22d3ee; }
    .topo-edge.l3-p2p { stroke: #34d399; stroke-dasharray: 5 4; }
    .port-label { fill: #7dd3fc; font-size: 10px; }
    .port-label.right { text-anchor: end; }

    .links { border: 1px solid #1f2937; border-radius: 8px; background: #0f172a; padding: 8px; max-height: 120px; overflow: auto; }
    .link-row { font-size: 12px; color: #cbd5e1; padding: 4px 0; border-bottom: 1px solid #1f2937; }    .link-row:last-child { border-bottom: none; }

    .chat-panel { padding: 10px; display: flex; flex-direction: column; height: 260px; min-height: 120px; max-height: 80vh; resize: vertical; overflow: hidden; flex-shrink: 0; }
    .messages { border: 1px solid #1f2937; border-radius: 8px; background: #0b1220; padding: 10px; overflow: auto; flex: 1; }
    .msg { margin-bottom: 8px; padding: 8px; border-radius: 6px; font-size: 13px; }
    .msg-user { background: #1d4ed8; color: #fff; text-align: right; }
    .msg-ai { background: #1f2937; }
    .msg-system { background: #334155; color: #cbd5e1; }
    .msg pre { background: #0f172a; border: 1px solid #1e293b; border-radius: 6px; padding: 8px; margin: 6px 0; font-size: 12px; color: #94a3b8; white-space: pre-wrap; word-break: break-all; overflow-x: auto; max-height: 200px; overflow-y: auto; }
    .msg .cmd-label { font-size: 11px; color: #67e8f9; margin-bottom: 2px; }
    .msg .answer { color: #e5e7eb; margin-top: 6px; line-height: 1.5; }
    .msg .answer strong { color: #67e8f9; }
    .chat-input { display: flex; gap: 8px; margin-top: 8px; }
    .chat-input input { flex: 1; border: 1px solid #334155; background: #0f172a; color: #e5e7eb; border-radius: 6px; padding: 8px; }

    .detail-row { display: flex; justify-content: space-between; border-bottom: 1px solid #1f2937; padding: 6px 0; }
    .detail-key { width: 80px; color: #94a3b8; font-size: 12px; flex-shrink:0; }
    .detail-val { flex: 1; color: #e5e7eb; font-size: 13px; margin-left: 8px; }

    .config-module { border: 1px solid #1f2937; border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
    .config-module-header { padding: 8px 10px; background: #0f172a; color: #67e8f9; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .config-module-header:hover { background: #1e293b; }
    .config-module-body { padding: 10px; display: none; }
    .config-module.open .config-module-body { display: block; }
    .config-exec-btn { width: 100%; padding: 8px; background: #1d4ed8; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; margin-top: 6px; }
    .config-exec-btn:hover { background: #2563eb; }
    .config-exec-btn:disabled { background: #334155; cursor: not-allowed; }
    .config-result { margin-top: 6px; padding: 6px; border-radius: 6px; font-size: 12px; max-height: 120px; overflow: auto; }
    .config-result.success { background: #064e3b; color: #6ee7b7; }
    .config-result.error { background: #450a0a; color: #fca5a5; }

    .cfg-tab { padding: 8px 14px; border: none; background: transparent; color: #94a3b8; font-size: 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
    .cfg-tab.active { color: #22d3ee; border-bottom-color: #22d3ee; }
    .cfg-tab:hover { color: #67e8f9; }
    .cfg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .cfg-grid .btn { font-size: 12px; padding: 8px 10px; text-align: left; min-height: 32px; }
    .cfg-grid .btn:hover { border-color: #22d3ee; background: #1e293b; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(2, 6, 23, 0.75); align-items: center; justify-content: center; z-index: 1000; }
    .modal.show { display: flex; }
    .modal-box { width: 460px; max-width: 92vw; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 14px; z-index: 1001; position: relative; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; position: relative; z-index: 10; }
    .close { background: #1e293b; color: #e5e7eb; border: 1px solid #475569; font-size: 20px; cursor: pointer; min-width: 32px; min-height: 32px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; padding: 4px; line-height: 1; flex-shrink: 0; }
    .close:hover { color: #ef4444; background: rgba(239,68,68,0.15); border-color: #ef4444; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; margin-bottom: 4px; color: #94a3b8; font-size: 12px; }
    .form-group input, .form-group select { width: 100%; border: 1px solid #334155; background: #0b1220; color: #e5e7eb; border-radius: 6px; padding: 8px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">NETOPS <span>AI</span></div>
    <div class="status"><span id="llm-status">LLM: 未配置</span> | <span id="device-count">设备: 0</span></div>
  </div>

  <div class="toolbar">
    <button class="btn" id="btn-add">+ 添加设备</button>
    <button class="btn" id="btn-llm">LLM 设置</button>
  </div>

  <div class="layout">
    <aside class="left">
      <div class="left-tabs">
        <button class="left-tab active" data-tab="devices">设备</button>
        <button class="left-tab" data-tab="audit">审计</button>
        <button class="left-tab" data-tab="knowledge">知识库</button>
      </div>
      <div class="left-content" id="tab-devices">
        <div id="device-list"></div>
      </div>
      <div class="left-content" id="tab-audit" style="display:none;">
        <div id="audit-logs"></div>
      </div>
      <div class="left-content" id="tab-knowledge" style="display:none;">
        <div id="knowledge-stats"></div>
      </div>
    </aside>

    <main class="center">
      <section class="topology-panel">
        <div class="topology-actions">
          <label style="font-size:12px;color:#94a3b8;display:flex;align-items:center;gap:4px;"><input type="checkbox" id="topo-autorefresh"> 实时刷新</label>
          <select id="topo-refresh-interval" style="font-size:11px;padding:4px 6px;background:#0f172a;color:#e5e7eb;border:1px solid #334155;border-radius:4px;min-height:28px;">
            <option value="5">5秒</option><option value="10" selected>10秒</option><option value="30">30秒</option><option value="60">60秒</option>
          </select>
          <button class="btn" id="btn-refresh-now" style="font-size:11px;padding:6px 10px;min-height:28px;">立即刷新</button>
        </div>
        <div id="topo-debug" style="position:absolute;top:0;left:0;z-index:999;background:#000;color:#0f0;font-size:10px;padding:4px;"></div>
        <div class="topology-infinite" id="topology-infinite">
          <div class="topology-world" id="topology-world">
            <svg id="topology-svg"></svg>
            <div id="topology-node-layer"></div>
          </div>
        </div>
      </section>

      <section class="chat-panel">
        <div class="messages" id="messages">
          <div class="msg msg-system">拓扑在上，对话在下。Ctrl+点击拓扑节点可多选设备，多选后操作会批量执行。</div>
        </div>
        <div class="chat-input">
          <input id="chat-input" placeholder="输入命令或问题，可直接说设备名或IP（如：核心交换机查路由表、127.0.0.1查版本）">
          <button class="btn" id="btn-stop" style="display:none;background:#dc2626;border-color:#dc2626;color:#fff;">停止</button>
          <button class="btn" id="btn-send">发送</button>
          <button class="btn" id="btn-clear-chat" style="background:#475569;border-color:#475569;font-size:12px;padding:4px 10px;" title="清空对话">清空</button>
        </div>
      </section>
    </main>
  </div>

  <!-- 设备详情弹窗 -->
  <div class="modal" id="modal-device-detail">
    <div class="modal-box" style="width:480px;max-height:80vh;display:flex;flex-direction:column;">
      <div class="modal-head"><strong id="detail-modal-title">设备详情</strong><button class="close" onclick="closeModal('modal-device-detail')">×</button></div>
      <div id="detail-content"></div>
      <div style="margin-top:10px;display:grid;gap:8px;">
        <button class="btn" id="btn-test-detail">测试连接</button>
        <button class="btn" id="btn-conn-edit-detail">编辑</button>
        <button class="btn" id="btn-delete-detail">删除设备</button>
      </div>
    </div>
  </div>

  <div class="modal" id="modal-device">
    <div class="modal-box">
      <div class="modal-head"><strong id="modal-device-title">添加设备</strong><button class="close" onclick="closeModal('modal-device')">×</button></div>
      <div class="form-group"><label>连接方式</label><select id="add-type" onchange="toggleFields()"><option value="ssh">SSH</option><option value="telnet">Telnet</option><option value="serial">串口</option></select></div>
      <div class="form-group"><label>设备类型</label><select id="add-device-type"><option value="layer2_switch">二层交换机</option><option value="layer3_switch">三层交换机</option><option value="router">路由器</option><option value="firewall">防火墙</option><option value="unknown" selected>自动识别</option></select></div>
      <div id="net-fields">
        <div class="form-group"><label>IP</label><input id="add-ip" placeholder="192.168.1.1"></div>
        <div class="form-group"><label>端口</label><input id="add-port" value="22"></div>
      </div>
      <div id="serial-fields" style="display:none;">
        <div class="form-group"><label>串口</label><input id="add-serial" placeholder="COM3"></div>
        <div class="form-group"><label>波特率</label><select id="add-baud"><option value="9600">9600</option><option value="115200" selected>115200</option></select></div>
      </div>
      <div class="form-group"><label>设备名称</label><input id="add-remark" placeholder="如：上海核心交换机"></div>
      <div class="form-group"><label>用户名</label><input id="add-user" placeholder="admin"></div>
      <div class="form-group"><label>密码</label><input id="add-pass" type="password"></div>
      <div class="modal-actions">
        <button class="btn" id="btn-save-device" style="background:#1d4ed8;color:#fff;">保存</button>
        <button class="btn" id="btn-test-device" style="display:none;">测试连接</button>
        <button class="btn" id="btn-delete-device" style="background:#7c2d12;border-color:#7c2d12;display:none;">删除</button>
        <button class="btn" onclick="closeModal('modal-device')" style="margin-left:auto;">取消</button>
      </div>
    </div>
  </div>

  <div class="modal" id="modal-conn">
    <div class="modal-box">
      <div class="modal-head"><strong>连接方式编辑</strong><button class="close" onclick="closeModal('modal-conn')">×</button></div>
      <div class="form-group"><label>连接方式</label><select id="conn-type" onchange="toggleConnFields()"><option value="ssh">SSH</option><option value="telnet">Telnet</option><option value="serial">串口</option></select></div>
      <div class="form-group"><label>设备类型</label><select id="conn-device-type"><option value="layer2_switch">二层交换机</option><option value="layer3_switch">三层交换机</option><option value="router">路由器</option><option value="firewall">防火墙</option><option value="unknown">自动识别</option></select></div>
      <div class="form-group"><label>设备名称</label><input id="conn-remark" placeholder="如：核心交换机"></div>
      <div id="conn-net-fields">
        <div class="form-group"><label>IP</label><input id="conn-ip" placeholder="192.168.1.1"></div>
        <div class="form-group"><label>端口</label><input id="conn-port" value="22"></div>
      </div>
      <div id="conn-serial-fields" style="display:none;">
        <div class="form-group"><label>串口</label><input id="conn-serial" placeholder="COM3"></div>
        <div class="form-group"><label>波特率</label><select id="conn-baud"><option value="9600">9600</option><option value="115200" selected>115200</option></select></div>
      </div>
      <div class="form-group"><label>用户名</label><input id="conn-user" placeholder="admin"></div>
      <div class="form-group"><label>密码</label><input id="conn-pass" type="password"></div>
      <div class="modal-actions"><button class="btn" onclick="closeModal('modal-conn')">取消</button><button class="btn" id="btn-save-conn">保存连接方式</button></div>
    </div>
  </div>

  <div class="modal" id="modal-llm">
    <div class="modal-box">
      <div class="modal-head"><strong>LLM 配置</strong><button class="close" onclick="closeModal('modal-llm')">×</button></div>
      <div class="form-group"><label>Endpoint</label><input id="llm-endpoint" placeholder="http://127.0.0.1:1234/v1"></div>
      <div class="form-group"><label>API Key（可选）</label><input id="llm-key"></div>
      <div class="form-group"><label>模型</label><select id="llm-model"><option value="">-- 获取 --</option></select></div>
      <div class="modal-actions"><button class="btn" id="btn-get-models">获取模型</button><button class="btn" id="btn-save-llm">保存</button></div>
    </div>
  </div>

  <div class="modal" id="modal-config">
    <div class="modal-box" style="width:680px;max-width:96vw;max-height:90vh;display:flex;flex-direction:column;">
      <div class="modal-head">
        <strong id="config-modal-title">配置中心</strong>
        <span id="config-device-type" style="margin-left:8px;font-size:11px;color:#94a3b8;"></span>
        <button class="close" onclick="closeModal('modal-config')">×</button>
      </div>
      <div id="config-tabs" style="display:flex;gap:0;border-bottom:1px solid #1f2937;margin-bottom:10px;flex-shrink:0;overflow-x:auto;"></div>
      <div id="config-panel" style="flex:1;overflow-y:auto;padding-right:4px;"></div>
    </div>
  </div>

  <script>
    let devices = [];
    let selectedId = null;
    let selectedIds = new Set();  // 多选设备集合
    let editingDeviceId = null;
    let currentDetailDevice = null;
    let editingBasicOnly = false;
    let topologyState = { nodes: [], links: [], version: 1 };
    let view = { x: 0, y: 0, scale: 1 };
    let dragNodeId = null;
    let dragStart = null;
    let panning = false;

    document.addEventListener('DOMContentLoaded', async () => {
      console.log('[NetOps] DOM loaded, initializing...');
      loadChatHistory();
      bindEvents();
      console.log('[NetOps] Events bound');
      await loadDevices();
      console.log('[NetOps] Devices loaded:', devices.length);
      await loadTopologyState();
      console.log('[NetOps] Topology state loaded, links:', (topologyState.links||[]).length);
      await loadTopologyTemplates();
      await loadLLM();
      buildTopologyFromDevices();
      renderAll();
      console.log('[NetOps] Init complete. openDeviceDetail:', typeof openDeviceDetail, 'openTopologyDeviceConfig:', typeof openTopologyDeviceConfig);
    });

    function bindEvents() {
      document.getElementById('btn-add').onclick = openAddDevice;
      document.getElementById('btn-save-device').onclick = saveDevice;

      const box = document.getElementById('messages');
      const cls = type === 'user' ? 'msg-user' : (type === 'system' ? 'msg-system' : 'msg-ai');
      let html = '';

      } catch(e) {}
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function formatAIResponse(text) {
      // 把 AI 回复按"命令:"/"命令：" 和 "输出:"/"输出：" 分段
      // 模式：命令: xxx \n 输出: yyy \n --- \n 总结内容
      let html = '';
      const parts = text.split(/---+/);
      const cmdSection = parts[0] || '';
      const answerSection = parts.slice(1).join('---').trim();

      // 解析命令和输出
      const cmdBlocks = [];
      const cmdRegex = /(?:命令|命令)[：:]\s*(.*?)(?=(?:输出|输出)[：:]|$)/gs;
      const outRegex = /(?:输出|输出)[：:]\s*(.*?)(?=---|(?:命令|命令)[：:]|$)/gs;

      // 简单分段：按 "命令:" 和 "输出:" 切
      let remaining = cmdSection;
      let hasCmd = false;
      while (remaining.length > 0) {
        const cmdIdx = remaining.search(/(?:命令)[：:]/);
        const outIdx = remaining.search(/(?:输出)[：:]/);

        if (cmdIdx >= 0 || outIdx >= 0) {
          hasCmd = true;
          // 取最早的那个
          const firstIdx = (cmdIdx >= 0 && outIdx >= 0) ? Math.min(cmdIdx, outIdx) : Math.max(cmdIdx, outIdx);
          const before = remaining.substring(0, firstIdx).trim();
          if (before) html += `<div class="answer">${escapeHtml(before)}</div>`;
          remaining = remaining.substring(firstIdx);

          if (remaining.startsWith('命令') || remaining.startsWith('命令')) {
            const endCmd = remaining.indexOf('输出');
            const cmdText = endCmd >= 0 ? remaining.substring(3, endCmd).replace(/[：:]/, '').trim() : remaining.substring(3).replace(/[：:]/, '').trim();
            html += `<div class="cmd-label">📌 命令</div>`;
            html += `<pre>${escapeHtml(cmdText)}</pre>`;
            remaining = endCmd >= 0 ? remaining.substring(endCmd) : '';
          } else if (remaining.startsWith('输出') || remaining.startsWith('输出')) {
            const endOut = remaining.indexOf('---');
            const endCmd2 = remaining.indexOf('命令', 3);
            let endPos = remaining.length;
            if (endOut >= 0) endPos = Math.min(endPos, endOut);
            if (endCmd2 >= 0) endPos = Math.min(endPos, endCmd2);
            const outText = remaining.substring(3, endPos).replace(/[：:]/, '').trim();
            html += `<div class="cmd-label">📋 输出</div>`;
            html += `<pre>${escapeHtml(outText)}</pre>`;
            remaining = remaining.substring(endPos);
          } else {
            html += escapeHtml(remaining);
            break;
          }
        } else {
          if (remaining.trim()) html += `<div class="answer">${escapeHtml(remaining)}</div>`;
          break;
        }
      }

      // 答案部分（--- 之后的内容，直接追加不额外加标题）
      if (answerSection) {
        html += `<div class="answer" style="margin-top:8px; padding-top:6px; border-top:1px solid #334155;">${escapeHtml(answerSection)}</div>`;
      }

      // 如果没有解析出任何命令块，直接显示原文
      if (!hasCmd && !answerSection) {
        html = `<div class="answer">${escapeHtml(text)}</div>`;
      }

      return html;
    }

    let _clickMoved = false;

    function initTopologyInteractions() {
      const infinite = document.getElementById('topology-infinite');
      const nodeLayer = document.getElementById('topology-node-layer');

      infinite.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? -0.08 : 0.08;
        view.scale = Math.min(2.2, Math.max(0.4, view.scale + delta));
        renderTopology();
      }, { passive: false });

      infinite.addEventListener('mousedown', (e) => {
        const node = e.target.closest('.topo-node');
        if (node) {
          dragNodeId = node.dataset.id;
          dragStart = { x: e.clientX, y: e.clientY };
          _clickMoved = false;
          e.preventDefault();
          return;
        }
        panning = true;
        dragStart = { x: e.clientX, y: e.clientY };
        _clickMoved = false;
      });

      window.addEventListener('mousemove', (e) => {
        if (dragNodeId) {
          const n = (topologyState.nodes || []).find(x => x.id === dragNodeId);
          if (!n || !dragStart) return;
          const dx = Math.abs(e.clientX - dragStart.x);
          const dy = Math.abs(e.clientY - dragStart.y);
          if (dx > 3 || dy > 3) _clickMoved = true;
          n.x += (e.clientX - dragStart.x) / view.scale;
          n.y += (e.clientY - dragStart.y) / view.scale;
          dragStart = { x: e.clientX, y: e.clientY };
          renderTopology();
          return;
        }
        if (panning && dragStart) {
          const dx = Math.abs(e.clientX - dragStart.x);
          const dy = Math.abs(e.clientY - dragStart.y);
          if (dx > 3 || dy > 3) _clickMoved = true;
          view.x += (e.clientX - dragStart.x);
          view.y += (e.clientY - dragStart.y);
          dragStart = { x: e.clientX, y: e.clientY };
          renderTopology();
        }
      });

      window.addEventListener('mouseup', async () => {
        if (dragNodeId || panning) {
          const wasClick = !_clickMoved;
          const wasPanning = panning;
          dragNodeId = null;
          panning = false;
          dragStart = null;
          _clickMoved = false;
          // 点击空白区域（非拖拽）→ 取消所有选中
          if (wasClick && wasPanning && selectedIds.size > 0) {
            selectedIds.clear();
            selectedId = null;
            renderAll();
          }
          await syncTopologyState();
        }
      });

      // Esc 键取消选中
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (selectedIds.size > 0) {
            selectedIds.clear();
            selectedId = null;
            renderAll();
          }
        }
      });

      // 首次提示
      if (!window._topoTipShown) {
        window._topoTipShown = true;
        addMsg('system', '💡 滚轮缩放拓扑 · 拖拽移动节点 · Ctrl+点击多选 · 双击左侧设备打开配置');
      }
    }

    function renderTopology() {
      const typeLabels = {layer2_switch:'二层交换机',layer3_switch:'三层交换机',router:'路由器',firewall:'防火墙',switch:'二层交换机',unknown:'未分类'};
      const nodeLayer = document.getElementById('topology-node-layer');
      const svg = document.getElementById('topology-svg');
      const world = document.getElementById('topology-world');

      const nodes = topologyState.nodes || [];
      const links = topologyState.links || [];

      // 智能自动布局（力导向）——只对无坐标的节点布局，或全部重新布局
      const needLayout = nodes.some(n => typeof n.x !== 'number' || typeof n.y !== 'number');
      if (needLayout && nodes.length > 0 && links.length > 0) {
        // 初始位置：按拓扑层级排列
        // 找到连接数最多的节点放中间
        const connCount = {};
        links.forEach(l => { connCount[l.from] = (connCount[l.from]||0)+1; connCount[l.to] = (connCount[l.to]||0)+1; });
        const center = nodes.reduce((a,b) => (connCount[b.id]||0) > (connCount[a.id]||0) ? b : a);
        const cx = 400, cy = 250;
        center.x = cx; center.y = cy;
        // 其他节点按连线关系环形分布
        const others = nodes.filter(n => n.id !== center.id);
        const angleStep = (2 * Math.PI) / Math.max(others.length, 1);
        const radius = Math.max(180, others.length * 60);
        others.forEach((n, i) => {
          const angle = angleStep * i - Math.PI / 2;
          n.x = cx + radius * Math.cos(angle);
          n.y = cy + radius * Math.sin(angle);
        });
        // 力导向迭代优化（简化版）
        for (let iter = 0; iter < 60; iter++) {
          const forces = nodes.map(() => ({fx:0, fy:0}));
          // 节点间斥力
          for (let i = 0; i < nodes.length; i++) {
            for (let j = i+1; j < nodes.length; j++) {
              let dx = nodes[j].x - nodes[i].x;
              let dy = nodes[j].y - nodes[i].y;
              let dist = Math.sqrt(dx*dx + dy*dy) || 1;
              let repulse = 8000 / (dist * dist);
              let ux = dx/dist, uy = dy/dist;
              forces[i].fx -= ux * repulse;
              forces[i].fy -= uy * repulse;
              forces[j].fx += ux * repulse;
              forces[j].fy += uy * repulse;
            }
          }
          // 连线引力
          links.forEach(l => {
            const ai = nodes.findIndex(n => n.id === l.from);
            const bi = nodes.findIndex(n => n.id === l.to);
            if (ai < 0 || bi < 0) return;
            let dx = nodes[bi].x - nodes[ai].x;
            let dy = nodes[bi].y - nodes[ai].y;
            let dist = Math.sqrt(dx*dx + dy*dy) || 1;
            let attract = (dist - 220) * 0.05;
            let ux = dx/dist, uy = dy/dist;
            forces[ai].fx += ux * attract;
            forces[ai].fy += uy * attract;
            forces[bi].fx -= ux * attract;
            forces[bi].fy -= uy * attract;
          });
          // 应用力
          const damping = 0.6;
          nodes.forEach((n, i) => {
            n.x += forces[i].fx * damping;
            n.y += forces[i].fy * damping;
            // 限制在画布内
            n.x = Math.max(40, Math.min(1200, n.x));
            n.y = Math.max(40, Math.min(600, n.y));
          });
        }
      } else if (needLayout && nodes.length > 0) {
        // 没有链路时用网格布局
        let autoIdx = 0;
        nodes.forEach((n) => {
          if (typeof n.x !== 'number' || typeof n.y !== 'number') {
            const cols = 4;
            const row = Math.floor(autoIdx / cols);
            const col = autoIdx % cols;
            n.x = 40 + col * 200;
            n.y = 40 + row * 140;
            autoIdx++;
          }
        });
      }

      world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;

      if (!nodes.length) {
        nodeLayer.innerHTML = '<div style="color:#94a3b8;position:absolute;left:20px;top:20px;">暂无设备，请先添加设备。</div>';
        svg.innerHTML = '';
      } else {
        nodeLayer.innerHTML = nodes.map(n => {
          const t = (n.deviceType || '').toLowerCase();
          const cls = t.includes('router') ? 'router' : (t.includes('firewall') ? 'firewall' : 'switch');
          const dev = devices.find(x => x.id === n.id);
          const facts = dev?.facts || {};
          let chips = '';
          if (facts.vlan_count) chips += `<span class="chip ok">VLAN:${facts.vlan_count}</span>`;
          if (facts.up_interfaces) chips += `<span class="chip ok">UP:${facts.up_interfaces}</span>`;
          if (facts.trunk_ports?.length) chips += `<span class="chip warn">Trunk:${facts.trunk_ports.length}</span>`;
          chips += facts.last_collected ? `<span class="chip ok">● 在线</span>` : `<span class="chip" style="color:#6b7280;">○ 未采集</span>`;
          const selCls = selectedIds.has(n.id) ? ' selected' : '';
          return `
          <div class="topo-node ${cls}${selCls}" data-id="${n.id}" style="left:${n.x}px; top:${n.y}px;" onclick="selectTopoNode('${n.id}', event)" ondblclick="openTopologyDeviceConfig('${n.id}', event)" title="${n.remark || n.name}\nIP: ${n.ip || 'N/A'}\n类型: ${typeLabels[n.deviceType] || n.deviceType}\n${n.facts && n.facts.vlan_count ? 'VLAN: ' + n.facts.vlan_count : ''}\n${n.facts && n.facts.up_interfaces != null ? 'UP接口: ' + n.facts.up_interfaces + '/' + n.facts.total_interfaces : ''}\n单击选中 · 双击打开配置">
            <div class="topo-head">${iconSvg(t)}<div class="node-remark">${n.remark || n.name || '未命名设备'}</div><span class="node-status ${(() => { const ls = n.facts && n.facts.last_collected ? new Date(n.facts.last_collected).getTime() : 0; return ls && (Date.now() - ls < 3600000) ? 'online' : 'offline'; })()}"></span></div>
            ${chips ? `<div class="node-chips">${chips}</div>` : ''}
          </div>
        `;
        }).join('');

        // 同一对设备间的链路用同一种颜色
        const colors = ['#22d3ee','#a78bfa','#f472b6','#fb923c','#4ade80','#facc15','#60a5fa','#f87171'];
        const pairColors = {};
        let colorIdx = 0;
        links.forEach(l => {
          const pk = [l.from, l.to].sort().join('::');
          if (!(pk in pairColors)) { pairColors[pk] = colors[colorIdx % colors.length]; colorIdx++; }
        });

        svg.innerHTML = links.map((l, idx) => {
          const a = nodes.find(n => n.id === l.from);
          const b = nodes.find(n => n.id === l.to);
          if (!a || !b) return '';

          const pairKey = [l.from, l.to].sort().join('::');
          const siblings = links.filter(x => [x.from, x.to].sort().join('::') === pairKey);
          const order = siblings.findIndex(x => x.id === l.id || x === l);
          const offset = (order - (siblings.length - 1) / 2) * 14;

          const color = pairColors[pairKey];
          const shortPort = (p) => {
            const s = (p || '?').trim();
            return s
              .replace(/^GigabitEthernet/i, 'GE')
              .replace(/^Ten-GigabitEthernet/i, '10GE')
              .replace(/^FortyGigE/i, '40GE')
              .replace(/^HundredGigE/i, '100GE')
              .replace(/^Ethernet/i, 'Eth');
          };
          const lp = shortPort(l.from_port);
          const rp = shortPort(l.to_port);

          // Node centers
          const acx = a.x + 60, acy = a.y + 16;
          const bcx = b.x + 60, bcy = b.y + 16;
          // Direction unit vector
          const dx = bcx - acx, dy = bcy - acy;
          const len = Math.sqrt(dx*dx + dy*dy) || 1;
          const ux = dx/len, uy = dy/len;
          // Perpendicular for offset
          const px = -uy * offset, py = ux * offset;
          // 计算线和节点矩形的交点（节点 120×32，中心偏移 hw=60, hh=19）
          const hw = 60, hh = 19;
          function edgeDist(ux, uy, hw, hh) {
            // 从中心沿 (ux,uy) 方向到矩形边的距离
            const dx = Math.abs(ux) > 0.001 ? hw / Math.abs(ux) : 9999;
            const dy = Math.abs(uy) > 0.001 ? hh / Math.abs(uy) : 9999;
            return Math.min(dx, dy) + 2; // +2 留一点间距
          }
          const rA = edgeDist(ux, uy, hw, hh);
          const rB = edgeDist(-ux, -uy, hw, hh);
          const x1 = acx + ux*rA + px, y1 = acy + uy*rA + py;
          const x2 = bcx + (-ux)*rB + px, y2 = bcy + (-uy)*rB + py;
          const mx = (x1+x2)/2, my = (y1+y2)/2;

          // 端口标签：沿线垂直方向偏移，贴在线段上
          const lineOff = (order - (siblings.length - 1) / 2) * 16;
          // from 端：线段 22% 处 + 垂直偏移
          const tag1x = x1 + (x2-x1)*0.22 + (-uy)*lineOff;
          const tag1y = y1 + (y2-y1)*0.22 + (ux)*lineOff;
          // to 端：线段 78% 处 + 垂直偏移
          const tag2x = x1 + (x2-x1)*0.78 + (-uy)*lineOff;
          const tag2y = y1 + (y2-y1)*0.78 + (ux)*lineOff;

          return `<line class="topo-link" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
                  <rect x="${tag1x-17}" y="${tag1y-9}" width="35" height="13" rx="2" fill="rgba(6,15,27,0.92)" stroke="${color}" stroke-width="0.5"/>
                  <text x="${tag1x}" y="${tag1y}" fill="${color}" font-size="9" font-family="monospace" text-anchor="middle" font-weight="600">${lp}</text>
                  <rect x="${tag2x-17}" y="${tag2y-9}" width="35" height="13" rx="2" fill="rgba(6,15,27,0.92)" stroke="${color}" stroke-width="0.5"/>
                  <text x="${tag2x}" y="${tag2y}" fill="${color}" font-size="9" font-family="monospace" text-anchor="middle" font-weight="600">${rp}</text>
                  <circle cx="${mx}" cy="${my}" r="3" fill="${color}"/>`;
        }).join('');
      }

      if (!links.length) {
        // no links yet
      }
    }

    async function saveDevice() {
      const current = devices.find(x => x.id === editingDeviceId);
      const type = editingBasicOnly && current ? (current.conn_type || 'ssh') : document.getElementById('add-type').value;
      const payload = {
        conn_type: type,
        device_type: document.getElementById('add-device-type').value,
        remark: document.getElementById('add-remark').value.trim(),
        username: editingBasicOnly && current ? (current.username || '') : document.getElementById('add-user').value.trim(),
        password: editingBasicOnly && current ? (current.password || '') : document.getElementById('add-pass').value
      };
      if (editingDeviceId) {
        payload.device_id = editingDeviceId;
      }
      if (editingBasicOnly && editingDeviceId) {
        payload.basic_only = true;
      }

      if (type === 'serial') {
        payload.serial_port = editingBasicOnly && current ? (current.serial_port || '') : document.getElementById('add-serial').value.trim();
        payload.baud = editingBasicOnly && current ? parseInt(current.baud || 115200) : parseInt(document.getElementById('add-baud').value || '115200');
      } else {
        payload.ip = editingBasicOnly && current ? (current.ip || '') : document.getElementById('add-ip').value.trim();
        payload.port = editingBasicOnly && current ? parseInt(current.port || (type === 'telnet' ? 23 : 22)) : parseInt(document.getElementById('add-port').value || (type === 'telnet' ? '23' : '22'));
        if (!payload.ip) { alert('请输入 IP'); return; }
      }

      const r = await fetch('/api/device/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      let d;
      try { d = await r.json(); } catch(e) { alert('保存失败：服务器错误'); return; }
      if (!d.success) { alert(d.message || '保存失败'); return; }

      closeModal('modal-device');
      await loadDevices();
      buildTopologyFromDevices();
      await syncTopologyState();
      renderAll();
      // 新增设备后自动采集
      collectDeviceFacts(payload.remark || payload.name);
      addMsg('system', editingDeviceId ? '✅ 设备已更新， 自动采集中设备信息' : '⏳ 自动采集中...');
      editingDeviceId = null;
      editingBasicOnly = false;
    }

    async function structuredDiagnose(dev, type) {
      // 结构化诊断：走 /api/diagnose，不走 LLM，确定性排错
      const typeLabels = {vlan:'VLAN', routing:'路由', connectivity:'连通性'};
      const label = typeLabels[type] || type;
      addMsg('user', `🔍 ${label}诊断: ${dev}`);
      addMsg('system', `⏳ 正在执行${label}结构化诊断...`);
      try {
        const r = await fetch('/api/diagnose', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device: dev, type: type, symptom: `${label}故障排查` })
        });
        const res = await r.json();
        if (!res.success) {
          addMsg('ai', `❌ 诊断失败: ${res.message||'未知错误'}`);
          return;
        }
        // 格式化诊断结果
        let html = `<div style="background:#1e1b4b;border:1px solid #4f46e5;border-radius:8px;padding:12px;">`;
        html += `<div style="color:#a5b4fc;font-weight:600;margin-bottom:8px;">🔍 ${label}诊断结果</div>`;
        if (res.steps && res.steps.length) {
          for (const s of res.steps) {
            const icon = s.status === 'PASS' ? '✅' : (s.status === 'FAIL' ? '❌' : (s.status === 'WARNING' ? '⚠️' : '⏭️'));
            html += `<div style="margin-bottom:6px;">`;
            html += `<div>${icon} <b>${escapeHtml(s.step)}</b> — ${escapeHtml(s.message)}</div>`;
            if (s.suggestion) html += `<div style="color:#fbbf24;font-size:11px;margin-left:20px;">💡 ${escapeHtml(s.suggestion)}</div>`;
            html += `</div>`;
          }
        }
        if (res.root_cause) {
          html += `<div style="margin-top:8px;padding:8px;background:#7f1d1d;border-radius:4px;color:#fca5a5;">🎯 根因: ${escapeHtml(res.root_cause)}</div>`;
        }
        if (res.suggestions && res.suggestions.length) {
          html += `<div style="margin-top:8px;color:#86efac;font-size:12px;">💡 修复建议:</div>`;
          for (const s of res.suggestions) {
            html += `<div style="color:#86efac;font-size:12px;margin-left:12px;">• ${escapeHtml(s)}</div>`;
          }
        }
        html += `</div>`;
        addMsg('ai', html);
      } catch(e) {
        addMsg('ai', `❌ 诊断请求失败: ${e.message}`);
      }
    }

        addMsg('ai', '❌ 预览失败: ' + e.message);
      }
    }

    async function confirmChatExec(btn, cmdsOrJson, msgOrStr, contextOrJson) {
      const cmds = typeof cmdsOrJson === 'string' ? JSON.parse(cmdsOrJson) : cmdsOrJson;
      const msg = typeof msgOrStr === 'string' ? msgOrStr : '';
      const context = typeof contextOrJson === 'string' ? JSON.parse(contextOrJson) : (contextOrJson || {});
      // 禁用按钮防止重复点击
      btn.disabled = true; btn.textContent = '执行中...';
      addMsg('user', msg);
      try {
        const r = await fetch('/api/chat', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
          message: msg, context, confirmed_commands: cmds
        })});
        const res = await r.json();
        addMsg('ai', (res.success?'✅ ':'❌ ')+(res.response||res.message||''));
      } catch(e) {
        addMsg('ai', '❌ 执行失败: '+e.message);
      }
    }

    async function clearChat() {
      if (!confirm('清空所有对话记录？')) return;
      try {
        const resp = await fetch('/api/chat/clear', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({})
        });
        const d = await resp.json();
        if (d.success) {
          chatHistory.length = 0;
          const box = document.getElementById('chat-messages');
          box.innerHTML = '<div style="color:#64748b;text-align:center;padding:20px;">对话已清空</div>';
        }
      } catch(e) {
        console.error('clear chat error:', e);
      }
    }

    async function sendChat() {
      if (_chatBusy) return;
      const input = document.getElementById('chat-input');
      const msg = input.value.trim();
      if (!msg) return;

      // 从拓扑多选中获取目标设备
      const selected = Array.from(selectedIds).map(id => devices.find(d => d.id === id)).filter(Boolean);
      let context = {};
      if (selected.length > 1) {
        context.selected_devices = selected.map(d => d.remark || d.name);
        context.selected_device = selected.map(d => d.remark || d.name).join('、');
      } else if (selected.length === 1) {
        context.selected_device = selected[0].name || selected[0].remark;
      } else {
        const d = devices.find(x => x.id === selectedId);
        if (d) context.selected_device = d.remark || d.name;
      }

      // ====== 先尝试快速模板匹配（不走 LLM，秒回）======
      const selDev = devices.find(x => x.id === selectedId);
      if (selDev) {
        try {
          const qr = await fetch('/api/quick-config', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
            message: msg, device: selDev?.name||selDev?.remark, mode: 'preview'
          })});
          const qd = await qr.json();
          if (qd.matched) {
            input.value = '';
            if (qd.query) {
              addMsg('user', msg);
              const parts = [];
              for (const r of (qd.results||[])) {
                if (r.success && r.results) {
                  for (const x of r.results) { parts.push(`命令: ${x.command}\n${x.output?.slice(0,2000)||''}`); }
                } else if (!r.success) { parts.push(`❌ ${r.error||'失败'}`); }
              }
              addMsg('ai', parts.join('\n---\n') || '查询完成');
              if(selDev) collectDeviceFacts(selDev?.name||selDev?.remark);
            } else if (qd.preview) {
              await sendChatWithPreview(msg, context);
            }
            return;
          }
        } catch(e) { /* 快速模板失败，fallback 到 LLM */ }
      }

      // 配置操作走预览确认流程（不再用 confirm 弹窗）
      const cfgWords = ['配置','创建','删除','修改','关闭','shutdown','undo','撤销'];
      const isConfigOp = cfgWords.some(k => msg.includes(k)) && !msg.includes('查询') && !msg.includes('查看') && !msg.includes('display') && !msg.includes('show');

      if (isConfigOp) {
        await sendChatWithPreview(msg, context);
        return;
      }

      addMsg('user', msg);
      input.value = '';
      _chatBusy = true;
      _chatAbort = new AbortController();
      document.getElementById('btn-stop').style.display = '';
      document.getElementById('btn-send').style.display = 'none';
      
      // 思考中占位
      const thinkingHtml = '<div class="chat-msg ai" id="thinking-placeholder"><span style="color:#67e8f9">⏳ 思考中...</span></div>';
      document.getElementById('chat-messages').insertAdjacentHTML('beforeend', thinkingHtml);
      
      try {
        const r = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg, context }),
          signal: _chatAbort.signal
        });
        const res = await r.json();
        const tp = document.getElementById('thinking-placeholder');
        if (tp) tp.remove();

        // 如果LLM返回了命令预览，走确认流程
        if (res.preview && res.planned_commands?.length) {
          const cmds = res.planned_commands;
          let previewHtml = '<div style="color:#f59e0b;font-weight:600;margin-bottom:6px;">⚠️ 命令预览</div>';
          cmds.forEach(c => {
            previewHtml += `<div style="margin-bottom:6px;"><span style="color:#22d3ee;font-size:12px;font-weight:600;">${c.device}</span>`;
            previewHtml += `<pre style="background:#0b1220;border:1px solid #334155;border-radius:4px;padding:8px;font-size:12px;overflow-x:auto;">${c.commands.join('\n')}</pre>`;
            previewHtml += '</div>';
          });
          previewHtml += `<div style="display:flex;gap:6px;margin-top:8px;">`;
          const cmdKey = '_pcmd_' + Date.now();
          window[cmdKey] = { cmds, msg, context };
          previewHtml += `<button class="btn" style="background:#16a34a;color:#fff;" onclick="confirmChatExec(this, window['${cmdKey}'].cmds, window['${cmdKey}'].msg, window['${cmdKey}'].context); delete window['${cmdKey}']">确认执行</button>`;
          previewHtml += `<button class="btn" onclick="this.parentElement.parentElement.remove()">取消</button>`;
          previewHtml += `</div>`;
          // 先显示LLM的文本回复
          if (res.response) addMsg('ai', res.response);
          addMsg('ai', previewHtml);
        } else {
          addMsg('ai', (res.executed ? '✅ ' : '') + (res.response || '无响应'));
        }
      } catch (e) {
        const tp = document.getElementById('thinking-placeholder');
        if (tp) tp.remove();
        if (e.name === 'AbortError') {
          addMsg('system', '⏹ 已停止');
        } else {
          addMsg('ai', '❌ 请求失败');
        }
      } finally {
        _chatBusy = false;
        _chatAbort = null;
        document.getElementById('btn-stop').style.display = 'none';
        document.getElementById('btn-send').style.display = '';
      }
    }

    function selectTopoNode(id, evt) {
      if (_clickMoved) return;
      const isCtrl = evt && (evt.ctrlKey || evt.metaKey);
      if (isCtrl) {
        if (selectedIds.has(id)) selectedIds.delete(id);
        else selectedIds.add(id);
      } else {
        selectedIds.clear();
        selectedIds.add(id);
      }
      selectedId = selectedIds.size > 0 ? Array.from(selectedIds).pop() : null;
      renderAll();
      updateSelectionInfo();
    }

    function openTopologyDeviceConfig(id, evt) {
      // 如果刚拖拽过，忽略点击
      if (_clickMoved) return;
      const isCtrl = evt && (evt.ctrlKey || evt.metaKey);
      if (isCtrl) {
        // Ctrl+点击：多选切换
        if (selectedIds.has(id)) selectedIds.delete(id);
        else selectedIds.add(id);
        selectedId = selectedIds.size > 0 ? Array.from(selectedIds).pop() : id;
        renderAll();
        updateSelectionInfo();

      const facts = d.facts || {};

      // 构建 tab 列表

    // ===== 统一执行 =====
    function execForm(type, dev) {
      const v = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
      const d = devices.find(x => x.id === selectedId);
      const vendor = d?.vendor || 'unknown';
      const isHua = vendor==='huawei'||vendor==='h3c'||vendor==='ruijie';
      const isCis = vendor==='cisco'||vendor==='cisco_nxos'||vendor==='arista'||vendor==='juniper';

      let commands = []; // 直接生成命令列表
      let msg = '';      // 用户可见描述

      switch(type) {
        case 'vlan': {
          const act=v('cfg-vlan-action'), vid=v('cfg-vlan-id'), nm=v('cfg-vlan-name');
          if(!vid){alert('填 VLAN ID');return;}
          if(act==='create') {
            msg = `创建 VLAN ${vid}${nm?' 名称 '+nm:''}`;
            if(isHua) commands = [`vlan ${vid}`, nm?`name ${nm}`:`description VLAN_${vid}`, 'quit'];
            else if(isCis) commands = [`vlan ${vid}`, nm?`name ${nm}`:`name VLAN_${vid}`, 'exit'];
          } else {
            msg = `删除 VLAN ${vid}`;
            if(isHua) commands = [`undo vlan ${vid}`];
            else if(isCis) commands = [`no vlan ${vid}`];
          }
          break;
        }
        case 'interface': {
          const port=v('cfg-if-port'), act=v('cfg-if-action'), val=v('cfg-if-val');
          if(!port){alert('填接口');return;}
          if(act==='shutdown') {
            msg=`关闭接口 ${port}`;
            commands = [`interface ${port}`, 'shutdown', isHua?'quit':'exit'];
          } else if(act==='noshutdown') {
            msg=`开启接口 ${port}`;
            commands = [`interface ${port}`, isHua?'undo shutdown':'no shutdown', isHua?'quit':'exit'];
          } else if(act==='desc') {
            msg=`设置接口 ${port} 描述 "${val}"`;
            commands = [`interface ${port}`, `description ${val}`, isHua?'quit':'exit'];
          } else if(act==='speed') {
            msg=`设置接口 ${port} 速率 ${val||'auto'}`;
            commands = [`interface ${port}`, `speed ${val||'auto'}`, isHua?'quit':'exit'];
          } else if(act==='duplex') {
            msg=`设置接口 ${port} 双工 ${val||'auto'}`;
            commands = [`interface ${port}`, `duplex ${val||'auto'}`, isHua?'quit':'exit'];
          }
          break;
        }
        case 'interface-batch': {
          const range=v('cfg-if-range'), act=v('cfg-if-batch-action'), desc=v('cfg-if-batch-desc');
          if(!range){alert('填接口范围');return;}
          // 华为用 interface range，思科用 interface range
          const ifCmd = isHua ? `interface range ${range}` : `interface range ${range}`;
          if(act==='shutdown') { msg=`批量关闭 ${range}`; commands=[ifCmd,'shutdown','quit']; }
          else if(act==='noshutdown') { msg=`批量开启 ${range}`; commands=[ifCmd,isHua?'undo shutdown':'no shutdown','quit']; }
          else if(act==='desc') { msg=`批量设置描述`; commands=[ifCmd,`description ${desc}`,'quit']; }
          break;
        }
        case 'portmode': {
          const port=v('cfg-pm-port'), mode=v('cfg-pm-mode'), vlan=v('cfg-pm-vlan'), allow=v('cfg-pm-allow');
          if(!port){alert('填接口');return;}
          if(mode==='access') {
            msg=`接口 ${port} → Access VLAN ${vlan||'?'}`;
            if(isHua) commands=[`interface ${port}`,'port link-type access',vlan?`port access vlan ${vlan}`:'',isHua?'quit':'exit'].filter(Boolean);
            else if(isCis) commands=[`interface ${port}`,'switchport mode access',vlan?`switchport access vlan ${vlan}`:'',isCis?'exit':'exit'].filter(Boolean);
          } else {
            msg=`接口 ${port} → Trunk` + (allow?` 允许VLAN ${allow}`:'');
            if(isHua) commands=[`interface ${port}`,'port link-type trunk',allow?`port trunk permit vlan ${allow}`:'port trunk permit vlan all','quit'].filter(Boolean);
            else if(isCis) commands=[`interface ${port}`,'switchport mode trunk',allow?`switchport trunk allowed vlan ${allow}`:'','exit'].filter(Boolean);
          }
          break;
        }
        case 'l3-if': {
          const ft=v('cfg-l3-iftype'), iface=v('cfg-l3-iface'), ip=v('cfg-l3-ip');
          if(!iface||!ip){alert('填接口和 IP');return;}
          msg=`配置${ft==='svi'?'VLAN接口':ft==='loopback'?'Loopback':'物理接口'} ${iface}，IP ${ip}`;
          if(isHua) commands=[`interface ${iface}`,`ip address ${ip}`,'quit'];
          else if(isCis) commands=[`interface ${iface}`,`ip address ${ip}`,'exit'];
          break;
        }
        case 'l3-route': {
          const dst=v('cfg-l3-rt-dst'), nh=v('cfg-l3-rt-nh');
          if(!dst||!nh){alert('填目标和下一跳');return;}
          msg=`静态路由 ${dst} → ${nh}`;
          commands = isHua ? [`ip route-static ${dst} ${nh}`] : [`ip route ${dst} ${nh}`];
          break;
        }
        case 'l3-ospf': {
          const id=v('cfg-l3-ospf-id')||'1', net=v('cfg-l3-ospf-net');
          if(!net){alert('填网段');return;}
          msg=`OSPF 进程 ${id} 宣告 ${net}`;
          if(isHua) commands=[`ospf ${id}`,`network ${net}`,'quit'];
          else if(isCis) commands=[`router ospf ${id}`,`network ${net} area 0`];
          break;
        }
        case 'ping': {
          const ip=v('cfg-dg-ping'), c=v('cfg-dg-ping-c')||'5';
          if(!ip){alert('填目标 IP');return;}
          msg=`ping ${ip}`;
          commands = [isHua?`ping ${ip} count ${c}`:`ping ${ip} repeat ${c}`];
          break;
        }
        case 'traceroute': {
          const ip=v('cfg-dg-trace');
          if(!ip){alert('填目标');return;}
          msg=`traceroute ${ip}`;
          commands = [isHua?`tracert ${ip}`:`traceroute ${ip}`];
          break;
        }
        default: {
          // 其余复杂表单（BGP/DHCP/ACL/NAT/zone/sys）还是走 LLM
          // 回退到原来的自然语言方式
          return execFormLegacy(type, dev);
        }
      }

      if(!commands.length && !msg) return;
      const resultId = `cfg-${type}-result`;

      // 判断是查询还是配置
      const isQuery = commands.every(c => c.toLowerCase().startsWith('display') || c.toLowerCase().startsWith('show') || c.toLowerCase().startsWith('ping') || c.toLowerCase().startsWith('trac'));
      
      if(isQuery) {
        // 查询直接执行
        doExecDirect(dev, msg, commands, resultId);
      } else {
        // 配置走预览确认
        doExecDirectWithPreview(dev, msg, commands, resultId);
      }
    }

    async function doExecDirect(dev, msg, commands, resultId) {
      const d = devices.find(x => x.id === selectedId);
      const el = document.getElementById(resultId);
      if(el){el.style.display='block';el.className='config-result';el.textContent='⏳ 执行中...';}
      try {
        const r = await fetch('/api/quick-config', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
          device: d?.name||d?.remark, mode:'execute', commands:[{device:d?.name||d?.remark, commands}]
        })});
        const res = await r.json();
        const output = (res.results||[]).map(r => {
          if(r.success && r.results) return r.results.map(x=>`命令: ${x.command}\n${x.output?.slice(0,2000)||''}`).join('\n---\n');
          return r.error ? `❌ ${r.error}` : '';
        }).filter(Boolean).join('\n---\n');
        if(el){el.className=res.success?'config-result success':'config-result error';el.textContent=output||'完成';}
        if(res.success) collectDeviceFacts(d?.name||d?.remark);
      } catch(e) {
        if(el){el.className='config-result error';el.textContent='请求失败';}
      }
    }

    async function doExecDirectWithPreview(dev, msg, commands, resultId) {
      const d = devices.find(x => x.id === selectedId);
      const devLabel = d?.name||d?.remark;
      const el = document.getElementById(resultId);

      // 显示确认弹窗
      let cmdListHtml = `<div style="margin-bottom:8px;"><div style="color:#22d3ee;font-size:12px;font-weight:600;">📌 设备: ${devLabel}</div>`;
      cmdListHtml += `<div style="background:#0b1220;border:1px solid #334155;border-radius:4px;padding:6px 8px;margin-top:2px;font-family:monospace;font-size:11px;">`;
      cmdListHtml += commands.map(c => `<div style="color:#e2e8f0;padding:1px 0;">${escapeHtml(c)}</div>`).join('');
      cmdListHtml += `</div></div>`;

      let confirmBox = document.getElementById('cfg-confirm-box');
      if(!confirmBox){
        confirmBox=document.createElement('div');confirmBox.id='cfg-confirm-box';
        confirmBox.style.cssText='position:sticky;bottom:0;background:#1a1030;border:1px solid #f59e0b;border-radius:8px;padding:12px;margin-top:8px;z-index:10;';
        const panel=document.getElementById('config-panel');if(panel)panel.appendChild(confirmBox);
      }
      confirmBox.innerHTML=`
        <div style="color:#f59e0b;font-size:13px;font-weight:600;margin-bottom:6px;">⚠️ ${msg} — 请确认后执行</div>
        ${cmdListHtml}
        <div style="display:flex;gap:8px;margin-top:10px;">
          <button id="btn-confirm-exec" style="flex:1;padding:8px;background:#dc2626;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;">确认执行</button>
          <button id="btn-cancel-exec" style="flex:1;padding:8px;background:#334155;color:#e5e7eb;border:none;border-radius:6px;cursor:pointer;">取消</button>
        </div>`;
      confirmBox.style.display='block';

      document.getElementById('btn-confirm-exec').onclick = async () => {
        confirmBox.style.display='none';
        if(el){el.style.display='block';el.className='config-result';el.textContent='⏳ 执行中...';}
        try {
          const r = await fetch('/api/quick-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
            device:devLabel,mode:'execute',commands:[{device:devLabel,commands}]
          })});
          const res = await r.json();
          const output = (res.results||[]).map(r => {
            if(r.success&&r.results) return r.results.map(x=>`命令: ${x.command}\n${x.output?.slice(0,2000)||''}`).join('\n---\n');
            return r.error?`❌ ${r.error}`:'';
          }).filter(Boolean).join('\n---\n');
          if(el){el.className=res.success?'config-result success':'config-result error';el.textContent=output||'完成';}
          if(res.success) collectDeviceFacts(devLabel);
        } catch(e) {
          if(el){el.className='config-result error';el.textContent='执行失败';}
        }
      };
      document.getElementById('btn-cancel-exec').onclick = () => {
        confirmBox.style.display='none';
        if(el){el.style.display='none';}
      };
    }

    function execFormLegacy(type, dev) {
      // 复杂表单回退走 LLM
      const v = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
      let msg = '';
      switch(type) {
        case 'portspecial': {
          const sp=v('cfg-pm-special'),port=v('cfg-pm-sp-port'),grp=v('cfg-pm-sp-group');
          if(!port||!grp){alert('填接口和组号');return;}
          const map={'agg-lacp':'配置 LACP 端口聚合','agg-static':'配置静态端口聚合','mirror-src':'配置镜像源端口','mirror-dst':'配置镜像目的端口'};
          msg=`在 ${dev} 上${map[sp]||sp}，接口 ${port}，组号 ${grp}`; break;
        }
        case 'l3-bgp': {
          const as=v('cfg-l3-bgp-as'),nbr=v('cfg-l3-bgp-nbr');
          if(!as){alert('填 AS 号');return;}
          msg=`在 ${dev} 上配置 BGP AS ${as}`; if(nbr) msg+=`，邻居 ${nbr}`; break;
        }
        case 'l3-dhcp': {
          const pool=v('cfg-l3-dhcp-pool'),net=v('cfg-l3-dhcp-net');
          if(!pool||!net){alert('填地址池和网段');return;}
          msg=`在 ${dev} 上配置 DHCP 地址池 ${pool}，${net}`; break;
        }
        case 'acl': {
          const act=v('cfg-sec-acl-act'),rid=v('cfg-sec-acl-id'),perm=v('cfg-sec-acl-perm'),src=v('cfg-sec-acl-src'),dst=v('cfg-sec-acl-dst'),proto=v('cfg-sec-acl-proto'),iface=v('cfg-sec-acl-if');
          if(act==='delete'){if(!rid){alert('填规则号');return;} msg=`在 ${dev} 上删除 ACL 规则 ${rid}`; break;}
          if(!src&&!dst){alert('填源或目标');return;}
          msg=`在 ${dev} 上创建 ACL 规则 ${rid||'自动'}，${perm} ${src||'any'} → ${dst||'any'}`;
          if(proto) msg+=` ${proto}`; if(iface) msg+=`，应用到 ${iface}`; break;
        }
        case 'nat': {
          const nt=v('cfg-sec-nat-type'),src=v('cfg-sec-nat-src'),ext=v('cfg-sec-nat-ext'),port=v('cfg-sec-nat-port');
          if(!src||!ext){alert('填内部地址和外部信息');return;}
          if(nt==='snat') msg=`在 ${dev} 上配置源 NAT，${src} 经 ${ext} 转换`;
          else msg=`在 ${dev} 上配置目的 NAT，外部 ${ext}→${src}${port?' 端口 '+port:''}`; break;
        }
        case 'zone': {
          const act=v('cfg-sec-zone-act'),nm=v('cfg-sec-zone-name'),val=v('cfg-sec-zone-val');
          if(!nm){alert('填域名');return;}
          const map={create:'创建安全域',addif:'将 '+val+' 加入安全域',policy:'配置域间策略'};
          msg=`在 ${dev} 上${map[act]||act} ${nm}`; if(act==='policy') msg+=`：${val}`; break;
        }
        case 'sys-name': { const nm=v('cfg-sys-name'); if(!nm){alert('填名称');return;} msg=`在 ${dev} 上设置设备名称为 ${nm}`; break; }
        case 'sys-mgmt': { const mg=v('cfg-sys-mgmt'); if(!mg){alert('填管理 IP');return;} msg=`在 ${dev} 上配置管理地址 ${mg}`; break; }
        case 'sys-sec': {
          const act=v('cfg-sys-sec-act'),val=v('cfg-sys-sec-val');
          const map={passwd:'设置 Console 密码',ssh:'启用 SSH 远程管理',telnet:'启用 Telnet 远程管理','acl-remote':'限制远程访问 IP 为 '+val};
          msg=`在 ${dev} 上${map[act]||act}${act==='passwd'?' 密码 '+val:''}`; break;
        }
      }
      if(!msg) return;
      const resultId = `cfg-${type}-result`;
      doExec(dev, msg, resultId);
    }

    function execBatchVlan(dev) {
      const text = document.getElementById('cfg-vlan-batch').value.trim();
      if(!text){alert('填 VLAN 列表');return;}
      const lines = text.split('\n').filter(l=>l.trim());
      const vlans = lines.map(l => { const p=l.trim().split(/\s+/); return p[0] + (p[1]?' 名称 '+p[1]:''); }).join('、');
      doExec(dev, `在 ${dev} 上批量创建 VLAN：${vlans}`, 'cfg-vlan-batch-result');
    }

    async function doExec(dev, msg, resultId) {
      // 判断是否为配置操作（需要预览确认）
      const cfgWords = ['配置','创建','删除','关闭','shutdown','undo','撤销','开启','开启接口','关闭接口','Trunk','Access','静态路由','OSPF','BGP','NAT','DHCP','ACL','安全域','SSH','SNMP','端口聚合','镜像','描述'];
      const isConfigOp = cfgWords.some(k => msg.includes(k));

      if (isConfigOp) {
        // 配置操作走预览确认流程
        await doExecWithPreview(dev, msg, resultId);
        return;
      }

      // 查询操作直接执行
      addMsg('user', msg);
      const el = document.getElementById(resultId);
      if(el){el.style.display='block';el.className='config-result';el.textContent='⏳ 执行中...';}
      const d = devices.find(x => x.id === selectedId);
      try {
        const r = await fetch('/api/chat', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,context:{selected_device:d?.name||d?.remark}})});
        const res = await r.json();
        if(el){
          el.className = res.success ? 'config-result success' : 'config-result error';
          el.textContent = res.response || res.message || (res.success?'成功':'失败');
        }
        addMsg('ai', (res.success?'✅ ':'❌ ')+(res.response||res.message||''));
        if(res.success) collectDeviceFacts(d?.name||d?.remark);
      } catch(e) {
        if(el){el.className='config-result error';el.textContent='请求失败';}
        addMsg('ai','❌ 请求失败: '+e.message);
      }
    }

    async function doExecWithPreview(dev, msg, resultId) {
      const el = document.getElementById(resultId);
      if(el){el.style.display='block';el.className='config-result';el.textContent='⏳ 生成命令预览...';}
      const d = devices.find(x => x.id === selectedId);
      try {
        // 第一步：预览，只生成命令不执行
        const previewRes = await fetch('/api/chat', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
          message: msg,
          context: {selected_device: d?.name||d?.remark},
          preview_only: true
        })});
        const previewData = await previewRes.json();

        if (!previewData.success && !previewData.preview) {
          if(el){el.className='config-result error';el.textContent=previewData.message||'预览失败';}
          return;
        }

        if (!previewData.preview || !previewData.planned_commands?.length) {
          // LLM 没有生成工具调用（可能是纯文本回复），直接显示
          addMsg('user', msg);
          addMsg('ai', previewData.response || '无操作需要执行');
          if(el){el.style.display='none';}
          return;
        }

        // 第二步：显示确认弹窗
        const cmds = previewData.planned_commands;
        let cmdListHtml = '';
        for (const item of cmds) {
          cmdListHtml += `<div style="margin-bottom:8px;">`;
          cmdListHtml += `<div style="color:#22d3ee;font-size:12px;font-weight:600;">📌 设备: ${item.device}</div>`;
          if (item.commands?.length) {
            cmdListHtml += `<div style="background:#0b1220;border:1px solid #334155;border-radius:4px;padding:6px 8px;margin-top:2px;font-family:monospace;font-size:11px;">`;
            cmdListHtml += item.commands.map(c => `<div style="color:#e2e8f0;padding:1px 0;">${escapeHtml(c)}</div>`).join('');
            cmdListHtml += `</div>`;
          } else {
            cmdListHtml += `<div style="color:#6b7280;font-size:11px;">（无具体命令）</div>`;
          }
          cmdListHtml += `</div>`;
        }

        // 用内联确认区域代替 confirm() 弹窗
        let confirmBox = document.getElementById('cfg-confirm-box');
        if (!confirmBox) {
          confirmBox = document.createElement('div');
          confirmBox.id = 'cfg-confirm-box';
          confirmBox.style.cssText = 'position:sticky;bottom:0;background:#1a1030;border:1px solid #f59e0b;border-radius:8px;padding:12px;margin-top:8px;z-index:10;';
          const panel = document.getElementById('config-panel');
          if (panel) panel.appendChild(confirmBox);
        }
        confirmBox.innerHTML = `
          <div style="color:#f59e0b;font-size:13px;font-weight:600;margin-bottom:6px;">⚠️ 配置命令预览 — 请确认后执行</div>
          ${cmdListHtml}
          <div style="display:flex;gap:8px;margin-top:10px;">
            <button id="btn-confirm-exec" style="flex:1;padding:8px;background:#dc2626;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;">确认执行</button>
            <button id="btn-cancel-exec" style="flex:1;padding:8px;background:#334155;color:#e5e7eb;border:none;border-radius:6px;cursor:pointer;">取消</button>
          </div>
        `;
        confirmBox.style.display = 'block';

        if(el){el.style.display='none';}

        // 确认按钮
        document.getElementById('btn-confirm-exec').onclick = async () => {
          confirmBox.style.display = 'none';
          addMsg('user', msg);
          if(el){el.style.display='block';el.className='config-result';el.textContent='⏳ 执行中...';}
          try {
            // 第三步：确认后直接执行命令
            const execRes = await fetch('/api/chat', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
              message: msg,
              context: {selected_device: d?.name||d?.remark},
              confirmed_commands: cmds
            })});
            const execData = await execRes.json();
            if(el){
              el.className = execData.success ? 'config-result success' : 'config-result error';
              el.textContent = execData.response || execData.message || (execData.success?'成功':'失败');
            }
            addMsg('ai', (execData.success?'✅ ':'❌ ')+(execData.response||execData.message||''));
            if(execData.success) collectDeviceFacts(d?.name||d?.remark);
          } catch(e) {
            if(el){el.className='config-result error';el.textContent='执行失败';}
            addMsg('ai','❌ 执行失败: '+e.message);
          }
        };

        // 取消按钮
        document.getElementById('btn-cancel-exec').onclick = () => {
          confirmBox.style.display = 'none';
          if(el){el.style.display='none';}
          addMsg('system', '⏹ 已取消配置操作');
        };
      } catch(e) {
        if(el){el.className='config-result error';el.textContent='预览失败';}
        addMsg('ai','❌ 预览请求失败: '+e.message);
      }
    }

    function promptConfig(dev, action, placeholder) {
      // 在配置面板底部显示内联输入框
      let box = document.getElementById('cfg-prompt-box');
      if (!box) {
        box = document.createElement('div');
        box.id = 'cfg-prompt-box';
        box.style.cssText = 'position:sticky;bottom:0;background:#0f172a;border-top:1px solid #1e293b;padding:10px;margin-top:8px;';
        const panel = document.getElementById('config-panel');
        if (panel) panel.appendChild(box);
      }
      box.innerHTML = `
        <div style="font-size:12px;color:#94a3b8;margin-bottom:6px;">${action}</div>
        <div style="display:flex;gap:6px;">
          <input id="cfg-prompt-input" type="text" placeholder="${placeholder}" style="flex:1;background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:6px 10px;border-radius:4px;font-size:12px;outline:none;" onkeydown="if(event.key==='Enter')document.getElementById('cfg-prompt-ok').click()" autofocus />
          <button id="cfg-prompt-ok" class="btn" style="background:#1d4ed8;color:#fff;padding:6px 14px;white-space:nowrap;" onclick="
            const v=document.getElementById('cfg-prompt-input').value.trim();
            if(v){document.getElementById('cfg-prompt-box').innerHTML='';sendChatWithPreview('${action} '+v,{selected_device:'${dev}'});}
          ">执行</button>
          <button class="btn" style="padding:6px 10px;" onclick="document.getElementById('cfg-prompt-box').innerHTML=''">取消</button>
        </div>`;
      setTimeout(() => { const inp = document.getElementById('cfg-prompt-input'); if(inp) inp.focus(); }, 50);
    }

    async function quickQuery(device, msg) {
      const el = document.getElementById('cfg-query-result') || document.getElementById('cfg-dg-tool-result');
      if(el){el.style.display='block';el.className='config-result';el.textContent='⏳ 查询中...';}
      addMsg('user', msg);
      const d = devices.find(x => x.id === selectedId);
      const devName = d?.remark || d?.name || device;
      try {
        // 先尝试快速模板（秒回）
        let res = null;
        try {
          const qr = await fetch('/api/quick-config', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device:devName,mode:'preview',message:msg})});
          const qd = await qr.json();
          if(qd.matched && qd.results) {
            const parts = [];
            for(const r of (qd.results||[])) {
              if(r.success && r.results) { for(const x of r.results) { parts.push(`命令: ${x.command}\n${x.output?.slice(0,2000)||''}`); } }
              else if(!r.success) { parts.push(`❌ ${r.error||'失败'}`); }
            }
            res = {success:true, response: parts.join('\n---\n')||'查询完成', _fast:true};
          }
        } catch(e) { /* fallback to LLM */ }
        // 快速模板没匹配到，走LLM
        if(!res) {
          const r = await fetch('/api/chat', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,context:{selected_device:devName}})});
          res = await r.json();
        }
        if(el){el.className=res.success?'config-result success':'config-result error';el.textContent=res.response||res.message||'';}
        addMsg('ai',(res.success?'✅ ':'❌ ')+(res.response||res.message||''));
      } catch(e) { if(el){el.className='config-result error';el.textContent='失败';} }
    }

    async function collectDeviceFacts(deviceName) {
      if(!deviceName) return;
      try {
        await fetch('/api/device/collect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device:deviceName})});
        await loadDevices(); buildTopologyFromDevices();
        const nodes=topologyState.nodes||[]; for(const n of nodes){const dev=devices.find(x=>x.id===n.id);if(dev?.facts) n.facts=dev.facts;}
        renderTopology();
      } catch(e){console.error('采集失败:',e);}
    }

    async function refreshAllFacts() {
      if(!devices.length){addMsg('system','暂无设备');return;}
      addMsg('system','⏳ 采集中...');
      for(const d of devices){if(d.remark||d.ip) await collectDeviceFacts(d.remark||d.ip);}
      addMsg('system','✅ 采集完成');
    }

    // 拓扑实时刷新
    let _topoTimer = null;
    function startTopoRefresh(sec) {
      stopTopoRefresh();
      if(sec > 0) {
        _topoTimer = setInterval(async () => {
          try {
            // 自动刷新只同步状态，不跑发现
            const r = await fetch('/api/topology/state');
            const d = await r.json();
            if (d.state) {
              topologyState = d.state;
              renderAll();
            }
          } catch(e) {}
        }, sec * 1000);
      }
    }
    function stopTopoRefresh() { if(_topoTimer){clearInterval(_topoTimer);_topoTimer=null;} }

    async function testCurrentDevice() {
      const d = devices.find(x => x.id === editingDeviceId);
      if (!d) return;
      const btn = document.getElementById('btn-test-device');
      btn.textContent = '测试中...'; btn.disabled = true;
      try {
        const r = await fetch('/api/chat', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'测试连通性',context:{selected_device:d.name||d.remark}})});
        const res = await r.json();
        addMsg('ai', (res.success?'✅ ':'❌ ')+(res.response||res.message||''));
      } catch(e) { addMsg('ai','❌ 请求失败'); }
      btn.textContent = '测试连接'; btn.disabled = false;
    }

    async function deleteCurrentDevice() {
      if (!confirm('确认删除该设备？')) return;
      const r = await fetch('/api/device/delete', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:editingDeviceId})});
      const res = await r.json();
      if (res.success) {
        closeModal('modal-device');
        selectedId = null;
        editingDeviceId = null;
        await loadDevices();
        buildTopologyFromDevices();
        await syncTopologyState();
        renderAll();
        addMsg('system','✅ 设备已删除');
      } else {
        alert(res.message||'删除失败');
      }
    }

    // 审计日志加载
    async function loadAuditLogs() {
      const container = document.getElementById('audit-logs');
      container.innerHTML = '<div style="color:#6b7280;font-size:12px;">加载中...</div>';
      try {
        const r = await fetch('/api/audit/logs?limit=50');
        const d = await r.json();
        if (d.logs && d.logs.length > 0) {
          container.innerHTML = d.logs.map(log => {
            const cmds = log.details?.commands || [];
            const cmdsHtml = cmds.length ? `<div style="color:#94a3b8;font-size:10px;margin-top:2px;font-family:monospace;">${cmds.map(c=>escapeHtml(c)).join(' → ')}</div>` : '';
            const inputHtml = log.details?.input ? `<div style="color:#64748b;font-size:10px;margin-top:1px;">${escapeHtml(log.details.input)}</div>` : '';
            return `
            <div class="audit-item">
              <div class="audit-time">${log.timestamp || ''}</div>
              <div><span class="audit-action">${log.action || ''}</span> <span class="audit-target">${log.target || ''}</span></div>
              ${inputHtml}${cmdsHtml}
              <div class="${log.success ? 'audit-success' : 'audit-failed'}">${log.success ? '成功' : '失败: ' + (log.error || '')}</div>
            </div>`;
          }).join('');
        } else {
          container.innerHTML = '<div style="color:#6b7280;font-size:12px;">暂无审计日志</div>';
        }
      } catch (e) {
        container.innerHTML = '<div style="color:#ef4444;font-size:12px;">加载失败</div>';
      }
    }

    // 知识库统计加载
    async function loadKnowledgeStats() {
      const container = document.getElementById('knowledge-stats');
      container.innerHTML = '<div style="color:#6b7280;font-size:12px;">加载中...</div>';
      try {
        const r = await fetch('/api/knowledge/stats');
        const d = await r.json();
        if (d.statistics) {
          const s = d.statistics;
          container.innerHTML = `
            <div style="margin-bottom:12px;">
              <div style="color:#94a3b8;font-size:11px;margin-bottom:4px;">统计信息</div>
              <div style="color:#22d3ee;font-size:14px;font-weight:600;">总案例: ${s.total_cases || 0}</div>
              <div style="color:#34d399;font-size:12px;">成功解决: ${s.successful_cases || 0}</div>
            </div>
            <div style="color:#94a3b8;font-size:11px;margin-bottom:4px;">常见解决方案</div>
            ${s.common_solutions && s.common_solutions.length > 0 ? s.common_solutions.map(sol => `
              <div class="knowledge-item">
                <div class="knowledge-solution">${sol}</div>
              </div>
            `).join('') : '<div style="color:#6b7280;font-size:12px;">暂无数据</div>'}
          `;
        } else {
          container.innerHTML = '<div style="color:#6b7280;font-size:12px;">暂无知识库数据</div>';
        }
      } catch (e) {
        container.innerHTML = '<div style="color:#ef4444;font-size:12px;">加载失败</div>';
      }
    }
  </script>

  <!-- Socket.IO 实时推送 -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    (function() {
      try {
        const socket = io();
        socket.on('diagnosis_step', function(data) {
          const cls = data.status === 'PASS' ? 'msg-success' : data.status === 'FAIL' ? 'msg-error' : 'msg-system';
          addMsg('system', `🔍 ${data.step}: ${data.message}`);
        });
        socket.on('progress', function(data) {
          addMsg('system', `⏳ 进度: ${data.current}/${data.total} (${data.percent}%) ${data.message}`);
        });
        socket.on('command_result', function(data) {
          addMsg(data.success ? 'success' : 'error', `📡 ${data.device} → ${data.command} (${data.duration}s)`);
        });
        socket.on('diagnosis_complete', function(data) {
          addMsg(data.success ? 'success' : 'error', `✅ 诊断完成: ${data.root_cause || '正常'}`);
          if (data.suggestions && data.suggestions.length) {
            data.suggestions.forEach(s => addMsg('system', `💡 ${s}`));
          }
        });
        socket.on('notification', function(data) {
          const icons = {info: 'ℹ️', warning: '⚠️', error: '❌'};
          addMsg(data.level === 'error' ? 'error' : 'system', `${icons[data.level]||'📢'} ${data.message}`);
        });
      } catch(e) { /* Socket.IO not available, fallback to polling */ }
    })();
  </script>
