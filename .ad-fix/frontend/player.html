<script>// === GLOBAL ERROR TRAP ===
window.addEventListener('error', function(e) {
  console.error('[VideoHub ERROR]', e.message, e.filename + ':' + e.lineno + ':' + e.colno);
  if (e.error) console.error('[VideoHub STACK]', e.error.stack);
});
window.addEventListener('unhandledrejection', function(e) {
  console.error('[VideoHub REJECT]', e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : 'unknown');
});

const API = '';
const isMobile = window.innerWidth <= 768;

// Helpers (defined in app.js but player.html doesn't load it)
function formatCount(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n || 0);
}
function localizeCategory(name) {
  if (!name) return t('uncategorized') || 'Uncategorized';
  var lang = localStorage.getItem('vh_lang') || 'en';
  var mapping = window._catI18n && window._catI18n[name];
  if (mapping && mapping[lang]) return mapping[lang];
  return name;
}

// Render video meta (views, category, time, uploader, stats) — reusable on lang change
function renderVideoMeta(video) {
  if (!video) return;
  document.getElementById('videoMeta').innerHTML =
    `${t('views_count').replace('{n}', video.views||0)} &bull; ${esc(localizeCategory(video.category))} &bull; ${esc(timeAgo(video.created_at))}${video.uploader_slug ? ' &bull; <a href="' + escUrl('/channel/' + encodeURIComponent(video.uploader_slug)) + '" style="color:#aaa;text-decoration:none">' + esc(video.uploader_name || 'Anonymous') + '</a>' + (video.uploader_verified ? ' <span style="color:#1da1f2">✓</span>' : '') : ''}`;
  var lc = document.getElementById('likeCount');
  if (lc) lc.textContent = formatCount(video.likes || 0);
  var fc = document.getElementById('favCount');
  if (fc) fc.textContent = formatCount(video.favorites || 0);
}

const id = new URLSearchParams(location.search).get('id');

let hlsIns = null;
let vrPlayer = null;
let boostPause = null;
let pauseActive = false;
let boostPop = null;
let popDone = false;
let _playerReady = false;  // HLS/video ready to play
let _wantPlay = false;    // preroll done, want to start playback

if (!id) {

  document.getElementById('videoTitle').removeAttribute('data-i18n');

  document.getElementById('videoTitle').textContent = t('no_video_specified');

  document.getElementById('playerLoading').style.display = 'none';

}

// Apply i18n to initial static elements

setMessage(t('resolving_source'), t('first_resolve_hint'));

function cleanTitle(title) {

  if (!title) return title;

  // Remove common source prefixes: [91porna], [91porn.plus], 【site name】, etc.

  return title

    .replace(/^[\[【][^\]】]+[\]】]\s*/, '')

    .replace(/^\[[^\]]+\]\s*/, '')

    .replace(/^[—\-–]\s*/, '')

    .trim() || title;

}

async function init() {

  if (!id) return;

  // 1. Run ad loading and video resolving in parallel
  // Preroll must never block playback forever - race against 8s timeout
  const prerollDone = loadBoost();
  const prerollRace = Promise.race([
    prerollDone,
    new Promise(r => setTimeout(r, 8000))
  ]);

  const result = await resolveVideo();

  if (!result || !result.videoUrl) {

    showError(t('resolve_failed'));

    return;

  }

  // 2. Init player immediately (preloads buffer) but don't autoplay yet

  document.getElementById('playerLoading').style.display = 'none';

  if (result.isVR) {

    window._vrPreloaded = true;  // set before init so VR player will not autoplay during preroll
    initVRPlayer(result.videoUrl, result.isHLS);



  } else {

    initPlayer(result.videoUrl, result.isHLS, true); // preloadOnly=true

  }

  // 3. Wait for preroll (with timeout fallback - never block forever)
  await prerollRace;

  // 4. Now start actual playback (if player ready, play now; else callback fires later)
  _wantPlay = true;
  if (_playerReady) startPlayback(result.isVR);
  // If not ready yet, MANIFEST_PARSED callback will call startPlayback when ready

  // 5. Load related

  window._currentVideoCategory = result.video.category;
  window._currentVideoId = id;
  window._currentVideo = result.video;
  populateVideoTags(result.video.tags);
  loadRelated(result.video.category, id);

}

function startPlayback(isVR) {
  if (isVR) {
    var v = document.getElementById('vrVideo');
    if (v) {
      var p = v.play();
      if (p && p.catch) p.catch(function(err) {
        console.warn('[Player] VR autoplay blocked:', err);
      });
    }
  } else {
    var v = document.getElementById('videoPlayer');
    if (v) {
      v.play().then(function() {
        // playing
      }).catch(function() {
        if (v.paused) { /* autoplay blocked, native controls available */ }
      });
    }
  }
}

// === Resolve video info + stream URL ===

async function resolveVideo() {

  let video;

  // Load category i18n map in parallel (used by localizeCategory in the meta)
  const catPromise = (async () => {
    try {
      const cats = await (await fetch(`${API}/api/categories`)).json();
      window._catI18n = {};
      cats.forEach(c => { if (c.name_i18n && Object.keys(c.name_i18n).length) window._catI18n[c.name] = c.name_i18n; });
    } catch {}
  })();

  // Kick off /api/play in parallel with /api/videos (it only needs `id`, no data dep).
  // The response is awaited later, after metadata is loaded & rendered.
  const playFetchPromise = fetch(`${API}/api/play/${id}`).catch(() => null);

  try {

    const r = await fetch(`${API}/api/videos/${id}`);

    video = await r.json();

    fetch(`${API}/api/videos/${id}/view`, {method:'POST'}).catch(()=>{});

  } catch {

    document.getElementById('videoTitle').removeAttribute('data-i18n');

    document.getElementById('videoTitle').textContent = t('video_info_load_failed');

    showError(t('video_info_load_failed'));

    return null;

  }

  await catPromise;  // ensure category i18n map is ready before rendering meta

  document.getElementById('videoTitle').removeAttribute('data-i18n');

  document.getElementById('videoTitle').textContent = cleanTitle(video.title) || t('no_title');

  renderVideoMeta(video);

  const isVR = video.vr_mode === 'equirectangular';

  const sourceUrl = video.url;

  // 1. /api/play

  setMessage(t('resolving_source'), t('first_resolve_hint'));

  let videoUrl = null;

  let isHLS = false;

  try {

    const playRes = await playFetchPromise;

    if (playRes && playRes.ok) {

      const ct = (playRes.headers.get('content-type') || '').toLowerCase();

      if (ct.includes('mpegurl') || ct.includes('vnd.apple')) {

        videoUrl = `${API}/api/play/${id}`;

        isHLS = true;

        setMessage(t('resolve_success_hls'), '');

      } else if (ct.includes('json')) {

        const data = await playRes.json();

        if (data.video_url) {

          videoUrl = data.video_url;

          isHLS = data.format === 'hls' || data.video_url.includes('.m3u8');

          setMessage(t('resolve_success_video'), '');

        }

      } else if (ct.startsWith('video/')) {

        videoUrl = `${API}/api/play/${id}`;

        isHLS = ct.includes('mpegurl');

        setMessage(t('cache_hit'), '');

      }

    }

  } catch(e) { console.warn('play endpoint error:', e); }

  // 2. Fallback: /api/resolve

  if (!videoUrl) {

    setMessage(t('trying_backup'), '');

    try {

      const resolved = await (await fetch(`${API}/api/resolve?url=${encodeURIComponent(sourceUrl)}`)).json();

      if (resolved.video_url) {

        videoUrl = `${API}/api/proxy/stream?url=${encodeURIComponent(resolved.video_url)}&source=${encodeURIComponent(sourceUrl)}`;

        isHLS = (resolved.video_url||'').includes('.m3u8');

      }

    } catch(e) { console.warn('resolve failed:', e); }

  }

  // 3. Fallback: DB cached URL

  if (!videoUrl && video.video_url) {

    setMessage(t('using_cached'), t('cached_may_expire'));

    videoUrl = `${API}/api/proxy/stream?url=${encodeURIComponent(video.video_url)}&source=${encodeURIComponent(sourceUrl)}`;

    isHLS = video.video_url.includes('.m3u8');

  }

  if (!videoUrl) return null;

  return { videoUrl, isHLS, isVR, video };

}

// === Normal player (HLS.js) ===

function initPlayer(url, isHLS, preloadOnly) {

  const container = document.getElementById('playerContainer');

  const video = document.createElement('video');

  video.id = 'videoPlayer';

  video.controls = true;

  video.playsInline = true;

  video.muted = true;  // muted autoplay: browsers block sound autoplay without user gesture

  video.preload = 'auto';

  video.style.width = '100%';

  video.style.height = '100%';

  video.style.background = '#000';

  container.innerHTML = '';

  container.appendChild(video);

  // Pause ad - delayed to skip during seek
  // Chrome fires pause BEFORE seeking, so _seeking flag doesn't work
  // Use 200ms delay + check video.seeking property
  var _pauseAdTimer = null;

  video.addEventListener('seeking', () => { 
    if (_pauseAdTimer) { clearTimeout(_pauseAdTimer); _pauseAdTimer = null; }
    closePausePromo(); pauseActive = false; 
  });

  video.addEventListener('pause', () => {
    if (_pauseAdTimer) clearTimeout(_pauseAdTimer);
    _pauseAdTimer = setTimeout(() => {
      _pauseAdTimer = null;
      if (video.seeking || video.ended) return;  // seeking or ended, skip ad
      if (boostPause && !pauseActive) { showPausePromo(boostPause); pauseActive = true; }
    }, 200);
  });

  video.addEventListener('play', () => { 
    if (_pauseAdTimer) { clearTimeout(_pauseAdTimer); _pauseAdTimer = null; }
    closePausePromo(); pauseActive = false; 
  });

  if (isHLS && typeof Hls !== 'undefined' && Hls.isSupported()) {

    hlsIns = new Hls({ maxBufferLength: 10, maxMaxBufferLength: 60, startLevel: -1, liveSyncDurationCount: 3, liveMaxLatencyDurationCount: 6, highBufferWatchdogPeriod: 2, maxBufferSize: 30 * 1024 * 1024 });

    hlsIns.loadSource(url);

    hlsIns.attachMedia(video);

    // Always register MANIFEST_PARSED - sets _playerReady and starts playback if wanted
    hlsIns.on(Hls.Events.MANIFEST_PARSED, () => {
      _playerReady = true;
      if (_wantPlay) startPlayback(false);
    });

    hlsIns.on(Hls.Events.ERROR, (_, data) => {

      if (data.fatal) {

        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hlsIns.startLoad();

        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hlsIns.recoverMediaError();

        else { hlsIns.destroy(); showError(t('tap_to_play', 'Tap to Play')); }

      }

    });

  } else if (isHLS && video.canPlayType('application/vnd.apple.mpegurl')) {

    video.src = url;
    video.addEventListener('loadedmetadata', () => {
      _playerReady = true;
      if (_wantPlay) startPlayback(false);
    });

  } else {

    video.src = url;
    video.addEventListener('loadeddata', () => {
      _playerReady = true;
      if (_wantPlay) startPlayback(false);
    });

  }

  video.onerror = () => showError(t('video_load_failed') + ' (' + (video.error?.code||'') + ')');

}

// Promos

let _prerollResolve = null; // resolved by closePrerollPromo

// Universal ad injector
function injectAd(el, html) {
  if (!el || !html) return;
  var code = Array.isArray(html) ? html.join('') : html;
  // Anti-block: backend already rewrites URLs to /_adp/ when use_proxy=1
  // No frontend rewrite needed - respect the use_proxy flag per ad
  el.innerHTML = code;
  el.style.display = 'block';
  if(el.parentNode) el.parentNode.style.display = 'block';
  el.querySelectorAll('script').forEach(function(s) {
    var ns = document.createElement('script');
    if (s.src) ns.src = s.src;
    else ns.textContent = s.textContent;
    if (s.async) ns.async = true;
    if (s.defer) ns.defer = true;
    if (s.type) ns.type = s.type;
    s.replaceWith(ns);
  });
  el.querySelectorAll('iframe[src]').forEach(function(f) {
    // Frontend no longer rewrites iframe src - backend handles via use_proxy flag
    // Force iframe to fill container width
    f.style.width = '100%';
    f.style.maxWidth = '100%';
  });
  // Force all child divs and iframes to fill width (works regardless of class name)
  el.querySelectorAll('div').forEach(function(d) {
    d.style.width = '100%';
    d.style.maxWidth = '100%';
  });
  el.querySelectorAll('iframe').forEach(function(f) {
    f.style.width = '100%';
    f.style.maxWidth = '100%';
  });
}

async function loadBoost() {
  try {
    const r = await fetch(`${API}/api/feed/html`);
    const slotMap = await r.json();
    if (!slotMap || typeof slotMap !== 'object') return;
    // Player page: stagger ad injection to avoid connection limit
    // 1. Top + bottom: immediate (visible above fold)
    if (slotMap.player_top) injectAd(document.getElementById('bt'), slotMap.player_top);
    if (slotMap.player_bot) injectAd(document.getElementById('bb'), slotMap.player_bot);
    // 2. Sidebars: deferred 800ms (only show on wide screens)
    setTimeout(function() {
      if (slotMap.player_left_sidebar) injectAd(document.getElementById('player_left_sidebar'), slotMap.player_left_sidebar);
      if (slotMap.player_right_sidebar) injectAd(document.getElementById('player_right_sidebar'), slotMap.player_right_sidebar);
    }, 800);
    if (slotMap.player_pause) {
      var pauseHtml = Array.isArray(slotMap.player_pause) ? slotMap.player_pause.join('') : slotMap.player_pause;
      boostPause = { ad_code: pauseHtml, id: 0, image_url: '', link_url: '', redirect_url: '', title: 'Ad', countdown: 6, pause_duration: 5 };
    }
    if (slotMap.popunder) initPop({ ad_code: slotMap.popunder });
    if (slotMap.preroll) {
      var prerollHtml = Array.isArray(slotMap.preroll) ? slotMap.preroll.join('') : slotMap.preroll;
      showPrerollPromo({ ad_code: prerollHtml, id: 0, image_url: '', link_url: '', redirect_url: '', title: 'Ad', countdown: 5 });
      return new Promise(resolve => { _prerollResolve = resolve; });
    }
  } catch(e) { console.warn('promos load failed:', e); }
}

let pauseTimer = null;

function showPausePromo(ad) {

  const el = document.getElementById('boostPause');

  if (!el) return;

  if (pauseTimer) { clearInterval(pauseTimer); pauseTimer = null; }

  el.style.display = 'flex';

  const dur = ad.pause_duration || 5;
  let sec = dur;

  // Inject ad content FIRST, then start countdown
  try {
    if (ad.image_url) {
      const isDataUri2 = ad.image_url && ad.image_url.startsWith('data:');
      const pauseImgSrc = isDataUri2 ? ad.image_url : `/api/proxy/image?url=${encodeURIComponent(ad.image_url)}`;
      el.innerHTML = `<img src="${pauseImgSrc}" alt="ad"><span class="countdown" id="pauseCd"></span>`;
    } else if (ad.ad_code) {
      el.innerHTML = ad.ad_code + '<span class="countdown" id="pauseCd"></span>';
      el.querySelectorAll('script').forEach(s => {
        const ns = document.createElement('script');
        if (s.src) ns.src = s.src;
        else ns.textContent = s.textContent;
        s.replaceWith(ns);
      });
      forceAdFill(el);
      setTimeout(() => forceAdFill(el), 500);
      setTimeout(() => forceAdFill(el), 1500);
      setTimeout(() => forceAdFill(el), 3000);
    } else {
      el.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:rgba(0,0,0,.85);border-radius:8px;color:rgba(255,255,255,.5);font-size:16px;font-weight:600">${ad.title||'Ad'}</div><span class="countdown" id="pauseCd"></span>`;
    }
    if (ad.link_url) el.onclick = () => { window.open(ad.redirect_url || ad.link_url, '_blank'); closePausePromo(); };
  } catch(e) { console.warn('pause ad inject error:', e); }

  // Start countdown AFTER innerHTML is set, so cntEl points to live element
  const cntEl = document.getElementById('pauseCd');
  if (cntEl) { cntEl.textContent = 'Ad ' + sec + 's'; cntEl.style.display = ''; }

  pauseTimer = setInterval(() => {
    sec--;
    if (sec <= 0) {
      clearInterval(pauseTimer); pauseTimer = null;
      closePausePromo();
    } else {
      const c = document.getElementById('pauseCd');
      if (c) c.textContent = 'Ad ' + sec + 's';
    }
  }, 1000);

}

function closePausePromo() {

  if (pauseTimer) { clearInterval(pauseTimer); pauseTimer = null; }

  const el = document.getElementById('boostPause');

  if (el) { el.style.display = 'none'; el.innerHTML = ''; }

  // Safety: ensure playerLoading is hidden
  var pl2 = document.getElementById('playerLoading');
  if (pl2) pl2.style.display = 'none';

  pauseActive = false;

}

function initPop(ad) {

  const last = parseInt(localStorage.getItem('vh_pop_ts') || '0');

  if (Date.now() - last < 30*60*1000) return;

  document.addEventListener('click', function handler(e) {

    if (popDone) return;

    if (['INPUT','TEXTAREA','SELECT','BUTTON'].includes(e.target.tagName)) return;

    if (e.target.closest('video') || e.target.closest('.overlay-pause') || e.target.closest('.overlay-preroll')) return;

    popDone = true;

    localStorage.setItem('vh_pop_ts', Date.now().toString());

    var popUrl = ad.redirect_url || ad.link_url || '';
    var popCode = ad.ad_code || '';
    if (!popUrl && !popCode) return;
    var w = window.open('', '_blank');
    if (w) {
      if (popUrl) w.location = popUrl;
      else if (popCode) { w.document.open(); w.document.write('<html><head><title></title></head><body>'+popCode+'</body></html>'); w.document.close(); }
      try { w.blur(); window.focus(); } catch(_){}
    }

    document.removeEventListener('click', handler);

  }, true);

}


// Force ad iframe to fill container
function forceAdFill(container) {
  if (!container) return;
  container.style.cssText = 'width:100%!important;height:100%!important;display:block!important';
  const divs = container.querySelectorAll('div');
  divs.forEach(d => {
    d.style.width = '100%';
    d.style.height = '100%';
    d.style.minHeight = '100%';
    d.style.display = 'block';
    d.style.margin = '0';
    d.style.position = 'relative';
  });
  const iframes = container.querySelectorAll('iframe');
  iframes.forEach(f => {
    f.style.width = '100%';
    f.style.height = '100%';
    f.style.minHeight = '100%';
    f.style.border = '0';
    f.style.display = 'block';
    f.style.margin = '0 auto';
  });
}

let prerollClock = null;

function showPrerollPromo(ad) {

  const overlay = document.getElementById('overlayPreroll');

  const content = document.getElementById('prerollSlot');

  const countdown = document.getElementById('prerollCd');

  const skip = document.getElementById('prerollClose');

  if (!overlay) return;

  // Countdown first - must start before ad injection
  let seconds = ad.countdown || 6;
  const showSkipAt = Math.max(0, seconds - 3);  // show Skip button after ~3s watched

  countdown.textContent = 'Ad ' + seconds + 's';

  countdown.style.display = '';

  skip.style.display = 'none';

  overlay.style.display = 'block';

  // playerLoading is managed by init() - don't touch it here

  prerollClock = setInterval(() => {

    seconds--;

    if (seconds <= 0) {

      clearInterval(prerollClock);

      prerollClock = null;

      closePrerollPromo();

    } else {

      countdown.textContent = 'Ad ' + seconds + 's';

      if (seconds <= showSkipAt) skip.style.display = '';

    }

  }, 1000);

  // Inject ad content in try/catch
  try {

    if (ad.image_url) {

      const isDataUri3 = ad.image_url && ad.image_url.startsWith('data:');

      const imgUrl = isDataUri3 ? ad.image_url : `/api/proxy/image?url=${encodeURIComponent(ad.image_url)}`;

      const goUrl = ad.redirect_url || ad.link_url || '#';

      content.innerHTML = goUrl ? `<a href="${goUrl}" target="_blank"><img src="${imgUrl}" alt="promo"></a>` : `<img src="${imgUrl}" alt="promo">`;

    } else if (ad.ad_code) {

      content.innerHTML = ad.ad_code;

      content.querySelectorAll('script').forEach(s => {
        const ns = document.createElement('script');
        if (s.src) ns.src = s.src;
        else ns.textContent = s.textContent;
        s.replaceWith(ns);
      });

      forceAdFill(content);
      setTimeout(() => forceAdFill(content), 500);
      setTimeout(() => forceAdFill(content), 1500);
      setTimeout(() => forceAdFill(content), 3000);

    } else {

      const link = (ad.redirect_url || ad.link_url) ? `<a href="${ad.redirect_url || ad.link_url}" target="_blank">` : '';

      const linkEnd = (ad.redirect_url || ad.link_url) ? '</a>' : '';

      content.innerHTML = `${link}<div style="background:linear-gradient(135deg,#2a1a3e,#1a2a4e,#1a3e2a);border:2px dashed rgba(255,71,87,.5);border-radius:12px;padding:40px 60px;color:rgba(255,255,255,.6);font-size:20px;font-weight:700;text-align:center;letter-spacing:2px">${ad.title || 'Promoted'}</div>${linkEnd}`;

    }

  } catch(e) { console.warn('preroll ad inject error:', e); }

  // Impression

  fetch(`${API}/api/v/${ad.id}`, {method:'POST'}).catch(()=>{});

}

function closePrerollPromo() {

  if (prerollClock) { clearInterval(prerollClock); prerollClock = null; }

  const overlay = document.getElementById('overlayPreroll');

  const content = document.getElementById('prerollSlot');

  if (overlay) overlay.style.display = 'none';

  if (content) content.innerHTML = '';

  // Safety: ensure playerLoading is hidden
  var pl = document.getElementById('playerLoading');
  if (pl) pl.style.display = 'none';

  // Unblock init()

  if (_prerollResolve) { _prerollResolve(); _prerollResolve = null; }

}

// Thumbnail retry for related-video cards (app.js is not loaded on this page)
var MAX_THUMB_RETRIES = 2;
var _thumbObserver = null;
if ('IntersectionObserver' in window) {
  _thumbObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (!entry.isIntersecting) return;
      var ph = entry.target;
      if (!ph.classList.contains('thumb-retry')) return;
      var origSrc = ph.getAttribute('data-retry-src');
      if (!origSrc) return;
      var count = parseInt(ph.getAttribute('data-retry-count') || '0', 10);
      _thumbObserver.unobserve(ph);
      if (count >= MAX_THUMB_RETRIES) return;
      ph.setAttribute('data-retry-count', String(count + 1));
      var newImg = document.createElement('img');
      newImg.onload = function() { ph.replaceWith(newImg); };
      newImg.onerror = function() {
        if (_thumbObserver) setTimeout(function() { _thumbObserver.observe(ph); }, 500);
      };
      newImg.src = origSrc + (origSrc.indexOf('?') > -1 ? '&' : '?') + '_r=' + Date.now();
    });
  }, { rootMargin: '200px' });
}
function imgRetry(img) {
  var origSrc = img.getAttribute('data-src') || (img.src ? img.src.split('_r=')[0] : '');
  var ph = document.createElement('div');
  ph.className = 'thumb-placeholder thumb-retry';
  ph.innerHTML = '\uD83C\uDFAC';
  if (origSrc) {
    ph.setAttribute('data-retry-src', origSrc);
    ph.setAttribute('data-retry-count', '0');
    if (_thumbObserver) _thumbObserver.observe(ph);
  }
  img.replaceWith(ph);
}

function timeAgo(dateStr) {

  if (!dateStr) return '';

  const diff = Date.now() - new Date(dateStr).getTime();

  const m = Math.floor(diff / 60000);

  if (m < 60) return t('minute_ago').replace('{n}', m);

  const h = Math.floor(m / 60);

  if (h < 24) return t('hour_ago').replace('{n}', h);

  const d = Math.floor(h / 24);

  if (d < 30) return t('day_ago').replace('{n}', d);

  return dateStr.slice(0, 10);

}

<script>
function formatCount(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,'') + 'M';
  if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'K';
  return String(n);
}

// === Player Like/Favorite/Speed ===
function getPlayerStorage(key) {
  try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch { return {}; }
}
function savePlayerStorage(key, obj) {
  localStorage.setItem(key, JSON.stringify(obj));
}
function populateVideoTags(videoTags) {
  var container = document.getElementById('videoTags');
  if (!container) return;
  container.innerHTML = '';
  var tags = [];
  try {
    if (typeof videoTags === 'string') {
      tags = JSON.parse(videoTags);
    } else if (Array.isArray(videoTags)) {
      tags = videoTags;
    }
  } catch(e) { return; }
  if (!tags || !tags.length) return;
  tags.forEach(function(tag) {
    var disp = localizeTag(tag);
    if (!disp) return;
    var el = document.createElement('a');
    el.href = 'javascript:void(0)';
    el.className = 'video-tag-link';
    el.textContent = disp;
    el.onclick = function(e) { e.preventDefault(); loadRelatedByTag(tag); };
    container.appendChild(el);
  });
}

function togglePlayerLike() {
  var id = new URLSearchParams(location.search).get('id');
  if (!id) return;
  var liked = getPlayerStorage('vhLikes');
  var isLiking = !liked[id];
  if (isLiking) { liked[id] = 1; } else { delete liked[id]; }
  savePlayerStorage('vhLikes', liked);
  updatePlayerLikeFav();
  var url = isLiking ? '/api/videos/'+id+'/like' : '/api/videos/'+id+'/unlike';
  fetch(url, {method:'POST'}).then(function(r){return r.json();}).then(function(d){
    var el = document.getElementById('likeCount');
    if (el) el.textContent = formatCount(d.likes||0);
  }).catch(function(){});
}
function togglePlayerFav() {
  var id = new URLSearchParams(location.search).get('id');
  if (!id) return;
  var faved = getPlayerStorage('vhFavs');
  var isFaving = !faved[id];
  if (isFaving) { faved[id] = 1; } else { delete faved[id]; }
  savePlayerStorage('vhFavs', faved);
  updatePlayerLikeFav();
  var url = isFaving ? '/api/videos/'+id+'/favorite' : '/api/videos/'+id+'/unfavorite';
  fetch(url, {method:'POST'}).then(function(r){return r.json();}).then(function(d){
    var el = document.getElementById('favCount');
    if (el) el.textContent = formatCount(d.favorites||0);
  }).catch(function(){});
}
function updatePlayerLikeFav() {
  var id = new URLSearchParams(location.search).get('id');
  if (!id) return;
  var liked = getPlayerStorage('vhLikes');
  var faved = getPlayerStorage('vhFavs');
  document.getElementById('btnLike').classList.toggle('liked', !!liked[id]);
  document.getElementById('btnFav').classList.toggle('faved', !!faved[id]);
}

updatePlayerLikeFav();

</script>
